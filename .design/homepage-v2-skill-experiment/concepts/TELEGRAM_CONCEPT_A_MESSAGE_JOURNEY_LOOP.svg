<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Approved Concept A — Telegram Codex Controller Message Journey Loop</title>
  <desc id="desc">A light editorial chapter with a dark navy controller canvas. A request enters from Telegram, passes through Controller, Project Worker, Codex Task, reaches Result, then returns to Telegram along a closed lower loop. An observability strip names permission, worker state, task state, usage, and completion or handoff without invented metrics.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d223f"/>
      <stop offset="1" stop-color="#142c4b"/>
    </linearGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38a8e8"/>
      <stop offset="0.62" stop-color="#72b7dd"/>
      <stop offset="1" stop-color="#55c99a"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8aa8c4"/>
    </marker>
  </defs>

  <rect width="1440" height="820" fill="#f4f8fb"/>
  <text x="92" y="92" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#39728f">AI-ASSISTED WORK SYSTEM</text>
  <text x="92" y="148" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#26384f">Telegram Codex Controller</text>
  <text x="92" y="190" font-family="Arial, sans-serif" font-size="20" fill="#60738b">A bounded request enters, becomes observable work, and returns control to the owner.</text>

  <rect x="92" y="240" width="1256" height="454" rx="28" fill="url(#panel)"/>
  <text x="132" y="294" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">MESSAGE JOURNEY LOOP</text>
  <text x="132" y="324" font-family="Arial, sans-serif" font-size="14" fill="#a9bdd0">Closed-loop orchestration • explicit control • observable state</text>

  <!-- Approved geometry thesis: one closed path owns both the visible connector and future animated token. -->
  <path id="telegram-loop-path" d="M220 430 H1160 Q1210 430 1210 480 V555 Q1210 605 1160 605 H220 Q170 605 170 555 V480 Q170 430 220 430 Z" fill="none" stroke="url(#loop)" stroke-width="3" opacity="0.8"/>

  <!-- Nodes -->
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(250 430)">
      <circle r="42" fill="#168fd1" stroke="#8ed8ff" stroke-width="2"/>
      <path d="M-18,-2 L22,-18 L12,20 L0,9 L-8,17 L-4,5 Z" fill="#fff"/>
      <text y="72" font-size="15" font-weight="700" fill="#fff">Telegram</text>
      <text y="94" font-size="12" fill="#9fb6c9">Request arrives</text>
    </g>
    <g transform="translate(470 430)">
      <circle r="42" fill="#173454" stroke="#77c8ef" stroke-width="2"/>
      <path d="M0,-22 L18,-14 L16,6 Q12,23 0,28 Q-12,23 -16,6 L-18,-14 Z" fill="none" stroke="#d9f1ff" stroke-width="3"/>
      <text y="72" font-size="15" font-weight="700" fill="#fff">Controller</text>
      <text y="94" font-size="12" fill="#9fb6c9">Permission + routing</text>
    </g>
    <g transform="translate(690 430)">
      <circle r="42" fill="#3b285c" stroke="#b697e9" stroke-width="2"/>
      <circle cy="-10" r="10" fill="none" stroke="#f0e8ff" stroke-width="3"/>
      <path d="M-18,22 Q-16,4 0,4 Q16,4 18,22" fill="none" stroke="#f0e8ff" stroke-width="3"/>
      <text y="72" font-size="15" font-weight="700" fill="#fff">Project Worker</text>
      <text y="94" font-size="12" fill="#b9acd1">Bounded task</text>
    </g>
    <g transform="translate(910 430)">
      <circle r="42" fill="#2b315f" stroke="#9ba6ef" stroke-width="2"/>
      <path d="M0,-22 L20,-10 V14 L0,26 L-20,14 V-10 Z M0,-22 V2 M20,-10 L0,2 L-20,-10 M0,2 V26" fill="none" stroke="#eceeff" stroke-width="3"/>
      <text y="72" font-size="15" font-weight="700" fill="#fff">Codex Task</text>
      <text y="94" font-size="12" fill="#b3b9df">Runs + progresses</text>
    </g>
    <g transform="translate(1130 430)">
      <circle r="42" fill="#123f3d" stroke="#66d7a9" stroke-width="2"/>
      <path d="M-18,0 L-5,14 L20,-16" fill="none" stroke="#e8fff6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="72" font-size="15" font-weight="700" fill="#fff">Result</text>
      <text y="94" font-size="12" fill="#a9d9c6">Completion / handoff</text>
    </g>
  </g>

  <!-- Return label and reduced-motion directional affordance only -->
  <text x="690" y="592" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#b7cadb">RETURN TO OWNER</text>
  <path d="M850 610 H520" fill="none" stroke="#8aa8c4" stroke-width="1.5" stroke-dasharray="7 8" marker-end="url(#arrow)" opacity="0.85"/>

  <!-- Observability categories; no invented numeric metrics -->
  <rect x="132" y="635" width="1176" height="42" rx="13" fill="#0a1c34" stroke="#284764"/>
  <g font-family="Arial, sans-serif" font-size="12" fill="#c0d1df" text-anchor="middle">
    <text x="250" y="661">PERMISSION</text>
    <text x="470" y="661">WORKER STATE</text>
    <text x="690" y="661">TASK STATE</text>
    <text x="910" y="661">USAGE / MODEL</text>
    <text x="1130" y="661">COMPLETION / HANDOFF</text>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="92" y="754" font-size="14" font-weight="700" fill="#315e78">MOTION THESIS</text>
    <text x="92" y="780" font-size="14" fill="#5c7087">One signal follows the same closed SVG path: blue while the request is being handled, green after result, then returns to Telegram. Node state changes may reinforce progress; duplicate arrows are hidden during motion.</text>
  </g>
</svg>
