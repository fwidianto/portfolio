<svg xmlns="http://www.w3.org/2000/svg" width="1730" height="447" viewBox="0 0 1730 447" role="img" aria-labelledby="title desc">
  <title id="title">Public-safe Sales Order Review Signals dashboard preview</title>
  <desc id="desc">Recreated dashboard preview showing sanitized Review Signal cards, mix bars, and detection cards.</desc>
  <defs>
    <style>
      .bg{fill:#f7fafc}.panel{fill:#fff;stroke:#d5e0eb;stroke-width:1.2}.card{fill:#fbfdff;stroke:#d5e0eb;stroke-width:1.2}.title{font-family:Inter,Arial,sans-serif;font-size:18px;font-weight:800;fill:#0f172a}.sub{font-family:Inter,Arial,sans-serif;font-size:13px;fill:#334e68}.label{font-family:Inter,Arial,sans-serif;font-size:13px;font-weight:700;fill:#334e68}.value{font-family:Inter,Arial,sans-serif;font-size:28px;font-weight:850;fill:#06101f}.note{font-family:Inter,Arial,sans-serif;font-size:13px;fill:#06101f}.tag{font-family:Inter,Arial,sans-serif;font-size:12px;font-weight:800;fill:#007c7a}.muted{font-family:Inter,Arial,sans-serif;font-size:12px;font-weight:800;fill:#334e68}.track{fill:#eef3f6}.green{fill:#6ba37b}.blue{fill:#8fb6c8}.red{fill:#d1847d}.gold{fill:#c9a15a}.teal{fill:#1f4d5a}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1730" height="447" rx="10"/>
  <rect class="panel" x="6" y="8" width="1718" height="432" rx="8"/>
  <text class="title" x="24" y="43">Review Signals</text>
  <text class="sub" x="24" y="66">Operational review grouping based on the currently filtered Sales Orders.</text>
  <rect class="card" x="23" y="83" width="328" height="82" rx="7"/>
  <rect class="card" x="361" y="83" width="328" height="82" rx="7"/>
  <rect class="card" x="699" y="83" width="328" height="82" rx="7"/>
  <rect class="card" x="1037" y="83" width="328" height="82" rx="7"/>
  <rect class="card" x="1375" y="83" width="328" height="82" rx="7"/>
  <text class="label" x="36" y="109">Healthy</text><text class="value" x="36" y="145">242</text>
  <text class="label" x="374" y="109">Watchlist</text><text class="value" x="374" y="145">7</text>
  <text class="label" x="712" y="109">Needs Review</text><text class="value" x="712" y="145">51</text>
  <text class="label" x="1050" y="109">Supplier Follow-up</text><text class="value" x="1050" y="145">0</text>
  <text class="label" x="1388" y="109">Operational Follow-up</text><text class="value" x="1388" y="145">63</text>

  <g transform="translate(23,184)">
    <text class="label" x="0" y="10">Healthy</text><text class="label" x="657" y="10" text-anchor="end">242</text><rect class="track" x="0" y="22" width="666" height="10" rx="5"/><rect class="green" x="0" y="22" width="444" height="10" rx="5"/>
    <text class="label" x="0" y="61">Watchlist</text><text class="label" x="657" y="61" text-anchor="end">7</text><rect class="track" x="0" y="73" width="666" height="10" rx="5"/><rect class="blue" x="0" y="73" width="13" height="10" rx="5"/>
    <text class="label" x="0" y="112">Needs Review</text><text class="label" x="657" y="112" text-anchor="end">51</text><rect class="track" x="0" y="124" width="666" height="10" rx="5"/><rect class="red" x="0" y="124" width="91" height="10" rx="5"/>
    <text class="label" x="0" y="163">Supplier Follow-up</text><text class="label" x="657" y="163" text-anchor="end">0</text><rect class="track" x="0" y="175" width="666" height="10" rx="5"/><rect class="gold" x="0" y="175" width="13" height="10" rx="5"/>
    <text class="label" x="0" y="214">Operational Follow-up</text><text class="label" x="657" y="214" text-anchor="end">63</text><rect class="track" x="0" y="226" width="666" height="10" rx="5"/><rect class="gold" x="0" y="226" width="115" height="10" rx="5"/>
  </g>

  <g transform="translate(703,180)">
    <rect class="card" x="0" y="0" width="326" height="116" rx="7"/><text class="label" x="13" y="24">Delayed delivery</text><text class="value" x="313" y="28" text-anchor="end">30</text><text class="note" x="13" y="61">Delivery date has passed before full delivery.</text><text class="tag" x="13" y="101">DETECTED</text>
    <rect class="card" x="336" y="0" width="326" height="116" rx="7"/><text class="label" x="349" y="24">Waiting invoice</text><text class="value" x="649" y="28" text-anchor="end">7</text><text class="note" x="349" y="61">Invoice pending after fulfillment progress.</text><text class="tag" x="349" y="101">DETECTED</text>
    <rect class="card" x="672" y="0" width="326" height="116" rx="7"/><text class="label" x="685" y="24">Source relationship check</text><text class="value" x="985" y="28" text-anchor="end">21</text><text class="note" x="685" y="61">Source type or follow-up status is unknown.</text><text class="tag" x="685" y="101">DETECTED</text>
    <rect class="card" x="0" y="128" width="326" height="116" rx="7"/><text class="label" x="13" y="152">Operational follow-up</text><text class="value" x="313" y="156" text-anchor="end">63</text><text class="note" x="13" y="189">Manufacturing or fulfillment follow-up is required.</text><text class="tag" x="13" y="229">DETECTED</text>
    <rect class="card" x="336" y="128" width="326" height="116" rx="7"/><text class="label" x="349" y="152">Supplier follow-up not detected from SO Phase 1</text><text class="value" x="649" y="156" text-anchor="end">0</text><text class="note" x="349" y="189">No reliable procurement follow-up field is exposed on</text><text class="note" x="349" y="209">this Sales Order payload.</text><text class="muted" x="349" y="229">NOT INCLUDED</text>
    <rect class="card" x="672" y="128" width="326" height="116" rx="7"/><text class="label" x="685" y="152">Contribution watchlist</text><text class="value" x="985" y="156" text-anchor="end">0</text><text class="note" x="685" y="189">Not included in Phase 1 because contribution fields are</text><text class="note" x="685" y="209">review context, not approved accounting profit rules.</text><text class="muted" x="685" y="229">NOT INCLUDED</text>
  </g>
</svg>