<svg xmlns="http://www.w3.org/2000/svg" width="1813" height="930" viewBox="0 0 1813 930" role="img" aria-label="Dashboard Concept Preview with recreated sample data for Odoo ERP Analytics">
  <defs>
    <style>
      .bg{fill:#f7f9fc}.panel{fill:#fff;stroke:#d7e2df;stroke-width:1.2}.panel-soft{fill:#f6f2ea;stroke:#d7e2df;stroke-width:1.2}.panel-tint{fill:#edf7f6;stroke:#9ccfc5;stroke-width:1.2}.text{font-family:Inter,Arial,sans-serif;fill:#0f172a}.muted{font-family:Inter,Arial,sans-serif;fill:#64748b}.eyebrow{font-family:Inter,Arial,sans-serif;fill:#1f4d5a;font-size:17px;font-weight:850;letter-spacing:.12em}.title{font-family:Inter,Arial,sans-serif;fill:#0f172a;font-size:43px;font-weight:850}.sub{font-family:Inter,Arial,sans-serif;fill:#64748b;font-size:18px}.small{font-family:Inter,Arial,sans-serif;fill:#64748b;font-size:14px}.label{font-family:Inter,Arial,sans-serif;fill:#496273;font-size:14px;font-weight:850;letter-spacing:.08em}.value{font-family:Inter,Arial,sans-serif;fill:#0f172a;font-size:34px;font-weight:850}.h3{font-family:Inter,Arial,sans-serif;fill:#0f172a;font-size:23px;font-weight:850}.h4{font-family:Inter,Arial,sans-serif;fill:#0f172a;font-size:18px;font-weight:800}.chip{fill:#fff;stroke:#cfd8e3;stroke-width:1}.chip-active{fill:#e9f8f5;stroke:#8ac9bd;stroke-width:1.2}.chip-text{font-family:Inter,Arial,sans-serif;fill:#0f172a;font-size:14px;font-weight:760}.chip-active-text{font-family:Inter,Arial,sans-serif;fill:#006b5f;font-size:14px;font-weight:850}.bar-bg{fill:#e5ebef}.bar-green{fill:#0f766e}.bar-amber{fill:#d97706}.bar-red{fill:#b45309}.table-head{fill:#f8fafc}.table-line{stroke:#e2e8f0;stroke-width:1}.th{font-family:Inter,Arial,sans-serif;fill:#475569;font-size:13px;font-weight:850;letter-spacing:.07em}.td{font-family:Inter,Arial,sans-serif;fill:#0f172a;font-size:16px;font-weight:650}.td-muted{font-family:Inter,Arial,sans-serif;fill:#64748b;font-size:15px;font-weight:620}.badge-ok{fill:#e8f7ef;stroke:#9bd2b4}.badge-watch{fill:#fff7e6;stroke:#f1c978}.badge-review{fill:#fff1f2;stroke:#f0a0a9}.badge-text{font-family:Inter,Arial,sans-serif;fill:#0f172a;font-size:13px;font-weight:850}.note{font-family:Inter,Arial,sans-serif;fill:#475569;font-size:15px}.num{font-family:Inter,Arial,sans-serif;fill:#1f4d5a;font-size:20px;font-weight:900}.connector{stroke:#b8c7c3;stroke-width:2;stroke-dasharray:7 8}.browser{fill:#ffffff;stroke:#d7e2df;stroke-width:1.2}.dot-red{fill:#ef9a9a}.dot-yellow{fill:#f8cf72}.dot-green{fill:#8bd3a7}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
  </defs>

  <rect class="bg" width="1813" height="930"/>

  <g transform="translate(36 28)">
    <rect class="browser" width="1741" height="874" rx="28" filter="url(#shadow)"/>
    <rect x="0" y="0" width="1741" height="58" rx="28" fill="#ffffff"/>
    <rect x="0" y="40" width="1741" height="18" fill="#ffffff"/>
    <circle class="dot-red" cx="30" cy="29" r="8"/><circle class="dot-yellow" cx="56" cy="29" r="8"/><circle class="dot-green" cx="82" cy="29" r="8"/>
    <rect x="126" y="16" width="420" height="26" rx="13" fill="#f1f5f9"/>
    <text class="small" x="146" y="34">odoo-review.local/dashboard/sales-order</text>

    <g transform="translate(34 88)">
      <text class="eyebrow" x="0" y="0">DASHBOARD CONCEPT PREVIEW</text>
      <text class="title" x="0" y="50">Odoo ERP Analytics Review View</text>
      <text class="sub" x="0" y="84">Recreated sample data showing how scattered ERP records can become review signals, follow-up priorities, and clearer order review.</text>
      <rect class="chip-active" x="1280" y="2" width="124" height="42" rx="12"/><text class="chip-active-text" x="1303" y="29">Sales Orders</text>
      <rect class="chip" x="1418" y="2" width="132" height="42" rx="12"/><text class="chip-text" x="1439" y="29">Internal Path</text>
      <rect class="chip" x="1564" y="2" width="110" height="42" rx="12"/><text class="chip-text" x="1585" y="29">Signals</text>
    </g>

    <g transform="translate(34 210)">
      <rect class="panel-tint" width="385" height="128" rx="20"/>
      <text class="label" x="22" y="34">ACTIVE ORDERS</text>
      <text class="value" x="22" y="82">370</text>
      <text class="small" x="22" y="108">open or recently reviewed</text>

      <g transform="translate(405 0)"><rect class="panel" width="385" height="128" rx="20"/><text class="label" x="22" y="34">DELIVERED</text><text class="value" x="22" y="82">280</text><text class="small" x="22" y="108">with delivery progress</text></g>
      <g transform="translate(810 0)"><rect class="panel" width="385" height="128" rx="20"/><text class="label" x="22" y="34">WATCHLIST</text><text class="value" x="22" y="82">32</text><text class="small" x="22" y="108">needs monitoring</text></g>
      <g transform="translate(1215 0)"><rect class="panel" width="385" height="128" rx="20"/><text class="label" x="22" y="34">REVIEW NEEDED</text><text class="value" x="22" y="82">18</text><text class="small" x="22" y="108">mixed path or delayed progress</text></g>
    </g>

    <g transform="translate(34 376)">
      <rect class="panel" width="1048" height="354" rx="24"/>
      <text class="h3" x="26" y="38">Order Review Table</text>
      <text class="small" x="26" y="64">Dummy order rows used to explain review logic, not internal company records.</text>
      <rect class="table-head" x="26" y="88" width="996" height="48" rx="12"/>
      <text class="th" x="46" y="118">ORDER REF</text><text class="th" x="180" y="118">SOURCE</text><text class="th" x="332" y="118">DELIVERY</text><text class="th" x="472" y="118">INVOICE</text><text class="th" x="604" y="118">PAYMENT</text><text class="th" x="738" y="118">SIGNAL</text><text class="th" x="892" y="118">NEXT REVIEW</text>
      <line class="table-line" x1="26" y1="154" x2="1022" y2="154"/>

      <g transform="translate(0 168)">
        <text class="td" x="46" y="0">SO-24-0142</text><text class="td-muted" x="180" y="0">From Stock</text><text class="td-muted" x="332" y="0">Delivered</text><text class="td-muted" x="472" y="0">Fully invoiced</text><text class="td-muted" x="604" y="0">Paid</text><rect class="badge-ok" x="734" y="-20" width="82" height="30" rx="15"/><text class="badge-text" x="754" y="0">Healthy</text><text class="td-muted" x="892" y="0">Routine</text>
      </g>
      <line class="table-line" x1="26" y1="198" x2="1022" y2="198"/>
      <g transform="translate(0 232)">
        <text class="td" x="46" y="0">SO-24-0179</text><text class="td-muted" x="180" y="0">Manufacture</text><text class="td-muted" x="332" y="0">In progress</text><text class="td-muted" x="472" y="0">Pending</text><text class="td-muted" x="604" y="0">Not due</text><rect class="badge-watch" x="734" y="-20" width="72" height="30" rx="15"/><text class="badge-text" x="754" y="0">Watch</text><text class="td-muted" x="892" y="0">Production</text>
      </g>
      <line class="table-line" x1="26" y1="262" x2="1022" y2="262"/>
      <g transform="translate(0 296)">
        <text class="td" x="46" y="0">SO-24-0208</text><text class="td-muted" x="180" y="0">Internal Order</text><text class="td-muted" x="332" y="0">Partial</text><text class="td-muted" x="472" y="0">Partial</text><text class="td-muted" x="604" y="0">Outstanding</text><rect class="badge-review" x="734" y="-20" width="76" height="30" rx="15"/><text class="badge-text" x="753" y="0">Review</text><text class="td-muted" x="892" y="0">Invoice</text>
      </g>
    </g>

    <g transform="translate(1120 376)">
      <rect class="panel" width="554" height="176" rx="24"/>
      <text class="h3" x="26" y="40">Review Signals</text>
      <g transform="translate(26 70)">
        <rect class="bar-bg" x="0" y="0" width="394" height="12" rx="6"/><rect class="bar-green" x="0" y="0" width="298" height="12" rx="6"/><text class="note" x="410" y="12">Healthy</text>
        <rect class="bar-bg" x="0" y="38" width="394" height="12" rx="6"/><rect class="bar-amber" x="0" y="38" width="156" height="12" rx="6"/><text class="note" x="410" y="50">Watch</text>
        <rect class="bar-bg" x="0" y="76" width="394" height="12" rx="6"/><rect class="bar-red" x="0" y="76" width="88" height="12" rx="6"/><text class="note" x="410" y="88">Review</text>
      </g>

      <g transform="translate(0 196)">
        <rect class="panel-soft" width="554" height="228" rx="24"/>
        <text class="h3" x="26" y="40">Follow-up Priority</text>
        <g transform="translate(28 68)">
          <text class="num" x="0" y="0">01</text><text class="h4" x="48" y="0">Supplier check</text><text class="small" x="48" y="22">Confirm incoming material for delivery readiness.</text>
          <line class="table-line" x1="0" y1="44" x2="498" y2="44"/>
          <text class="num" x="0" y="74">02</text><text class="h4" x="48" y="74">Invoice follow-up</text><text class="small" x="48" y="96">Delivered order not fully billed yet.</text>
          <line class="table-line" x1="0" y1="118" x2="498" y2="118"/>
          <text class="num" x="0" y="148">03</text><text class="h4" x="48" y="148">Source path review</text><text class="small" x="48" y="170">Mixed order relationship still needs checking.</text>
        </g>
      </g>
    </g>
  </g>
</svg>
