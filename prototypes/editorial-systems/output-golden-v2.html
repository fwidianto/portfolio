<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Output Golden v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --art-navy: #001834;
      --art-slate: #5a5c63;
      --art-sand: #dec6ac;
      --art-green: #00743c;
      --art-grid: #d9dde2;
      --art-white: #fefefe;
      --art-paper: #f6f0e5;
      --art-area: #edf1f4;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      background: var(--art-paper);
    }

    .output-golden-v2 {
      width: min(860px, calc(100vw - 32px), calc((100vh - 32px) * 1.653846));
      aspect-ratio: 860 / 520;
    }

    .output-golden-v2 svg {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 860 / 520;
      overflow: visible;
      background: var(--art-white);
      font-family: Inter, Arial, sans-serif;
    }

    .output-v2-frame,
    .output-v2-panel {
      fill: var(--art-white);
      stroke: var(--art-grid);
      stroke-width: 1;
    }

    .output-v2-panel-title {
      fill: var(--art-navy);
      font: 600 10px/1 Inter, Arial, sans-serif;
      letter-spacing: .01em;
    }

    .output-v2-eyebrow,
    .output-v2-metric-label,
    .output-v2-chart-label,
    .output-v2-system-label {
      fill: var(--art-slate);
      font: 500 7px/1 Inter, Arial, sans-serif;
      letter-spacing: .08em;
    }

    .output-v2-eyebrow,
    .output-v2-system-label { font-size: 6px; letter-spacing: .14em; }

    .output-v2-title-rule,
    .output-v2-divider,
    .output-v2-chart-grid,
    .output-v2-trends-grid,
    .output-v2-variance-baseline,
    .output-v2-variance-connector,
    .output-v2-distribution-legend-line,
    .output-v2-system-line {
      fill: none;
      stroke: var(--art-grid);
      stroke-width: 1;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .output-v2-title-rule { stroke: var(--art-navy); stroke-width: 1.2; }
    .output-v2-divider { stroke-width: .8; }

    .output-v2-metric {
      fill: var(--art-navy);
      font: 600 22px/1 "Cormorant Garamond", Georgia, serif;
    }

    .output-v2-metric-positive { fill: var(--art-green); }

    .output-v2-ring-base {
      fill: none;
      stroke: var(--art-grid);
      stroke-width: 12;
    }

    .output-v2-ring-arc { fill: none; stroke-width: 12; }
    .output-v2-ring-navy { stroke: var(--art-navy); }
    .output-v2-ring-sand { stroke: var(--art-sand); }
    .output-v2-ring-slate { stroke: var(--art-slate); }
    .output-v2-legend-navy { fill: var(--art-navy); }
    .output-v2-legend-slate { fill: var(--art-slate); }
    .output-v2-legend-sand { fill: var(--art-sand); }
    .output-v2-legend-ivory { fill: var(--art-grid); }
    .output-v2-legend-label { fill: var(--art-slate); font: 500 7px/1 Inter, Arial, sans-serif; letter-spacing: .08em; }

    .output-v2-chart-area { fill: var(--art-area); stroke: none; }
    .output-v2-chart-line { fill: none; stroke: var(--art-navy); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .output-v2-chart-point { fill: var(--art-white); stroke: var(--art-navy); stroke-width: 1.4; }
    .output-v2-chart-label { font-size: 7px; letter-spacing: .04em; }

    .output-v2-insights-panel { fill: var(--art-navy); stroke: var(--art-navy); }
    .output-v2-insight-row { fill: rgba(255,255,255,.12); stroke: none; }
    .output-v2-insight-dot { fill: var(--art-sand); }
    .output-v2-insight-mark { fill: none; stroke: var(--art-white); stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; }
    .output-v2-insight-copy { fill: var(--art-white); font: 500 7px/1 Inter, Arial, sans-serif; }
    .output-v2-insights-panel-title { fill: var(--art-white); }
    .output-v2-insights-eyebrow { fill: rgba(255,255,255,.56); }

    .output-v2-variance-bar,
    .output-v2-trends-bar { stroke-width: 1; }
    .output-v2-bar-navy { fill: var(--art-navy); stroke: var(--art-navy); }
    .output-v2-bar-green { fill: var(--art-green); stroke: var(--art-green); }
    .output-v2-bar-sand { fill: var(--art-sand); stroke: var(--art-sand); }
    .output-v2-variance-label,
    .output-v2-trends-label { fill: var(--art-slate); font: 500 6px/1 Inter, Arial, sans-serif; letter-spacing: .08em; }
    .output-v2-system-line { stroke: var(--art-navy); stroke-width: 1.2; }
    .output-v2-system-node { fill: var(--art-white); stroke: var(--art-navy); stroke-width: 1.2; }
    .output-v2-system-label { font-size: 6px; letter-spacing: .1em; text-anchor: middle; }
  </style>
</head>
