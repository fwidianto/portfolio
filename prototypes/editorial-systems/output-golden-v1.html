<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Output Golden v1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --art-navy: #001834;
      --art-slate: #5a5c63;
      --art-sand: #dec6ac;
      --art-green: #00743c;
      --art-grid: #d9dde2;
      --art-white: #fefefe;
      --art-paper: #f6f0e5;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: var(--art-paper);
    }

    .output-golden {
      width: 405px;
      height: 236px;
    }

    .output-golden svg {
      display: block;
      width: 405px;
      height: 236px;
      overflow: visible;
      background: var(--art-white);
      font-family: Inter, Arial, sans-serif;
    }

    .output-frame {
      fill: var(--art-white);
      stroke: var(--art-grid);
      stroke-width: 1;
    }

    .output-panel {
      fill: var(--art-white);
      stroke: var(--art-grid);
      stroke-width: 1;
    }

    .panel-title {
      fill: var(--art-navy);
      font: 600 7px/1 Inter, Arial, sans-serif;
    }

    .metric-label,
    .chart-label {
      fill: var(--art-slate);
      font: 4.6px/1 Inter, Arial, sans-serif;
      letter-spacing: .01em;
    }

    .metric-value {
      fill: var(--art-navy);
      font: 600 14px/1 "Cormorant Garamond", Georgia, serif;
    }

    .metric-growth { fill: var(--art-green); }

    .overview-divider,
    .chart-grid,
    .trend-grid,
    .distribution-legend-line {
      fill: none;
      stroke: var(--art-grid);
      stroke-width: .8;
    }

    .donut-base {
      fill: none;
      stroke: var(--art-grid);
      stroke-width: 10;
    }

    .donut-arc {
      fill: none;
      stroke-width: 10;
    }

    .donut-navy { stroke: var(--art-navy); }
    .donut-sand { stroke: var(--art-sand); }
    .donut-slate { stroke: var(--art-slate); }

    .legend-navy { fill: var(--art-navy); }
    .legend-slate { fill: var(--art-slate); }
    .legend-sand { fill: var(--art-sand); }
    .legend-ivory { fill: var(--art-grid); }

    .chart-area {
      fill: rgba(185, 191, 198, .2);
      stroke: none;
    }

    .chart-line {
      fill: none;
      stroke: var(--art-navy);
      stroke-width: 1.35;
      stroke-linejoin: round;
    }

    .chart-point {
      fill: var(--art-white);
      stroke: var(--art-navy);
      stroke-width: 1;
    }

    .insights-panel {
      fill: var(--art-navy);
      stroke: var(--art-navy);
    }

    .insight-row {
      fill: rgba(255, 255, 255, .18);
      stroke: none;
    }

    .insight-dot {
      fill: var(--art-sand);
    }

    .insight-mark {
      fill: none;
      stroke: var(--art-white);
      stroke-width: .8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .insight-copy {
      fill: var(--art-white);
      font: 4.2px/1 Inter, Arial, sans-serif;
    }

    .trends-bar {
      stroke: var(--art-navy);
      stroke-width: 9;
      stroke-linecap: butt;
    }

    .trends-bar-accent { stroke: var(--art-sand); }
  </style>
</head>
