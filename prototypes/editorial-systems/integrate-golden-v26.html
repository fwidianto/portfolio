<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <style>
    :root { --navy:#0e1a2e; --paper:#f7f2e8; --white:#fcfcfc; --slate:#5d626b; --sand:#cf9d63; --grid:#d7d7d1; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:1600px; height:900px; overflow:hidden; background:var(--paper); color:var(--navy); }
    body { font-family:Inter, ui-sans-serif, system-ui, sans-serif; }
    .page { position:relative; width:1600px; height:900px; background-image:linear-gradient(rgba(14,26,46,.045) 1px, transparent 1px),linear-gradient(90deg,rgba(14,26,46,.045) 1px,transparent 1px); background-size:64px 64px; }
    .sidebar { position:absolute; inset:0 auto 0 0; width:154px; background:var(--navy); color:var(--paper); padding:34px 24px; }

    .nav { position:absolute; top:328px; left:24px; right:18px; display:grid; gap:18px; font-size:10px; letter-spacing:.14em; }
    .nav div { display:flex; gap:14px; align-items:center; color:rgba(247,242,232,.72); }
    .nav div:first-child { color:var(--white); }
    .nav b { width:16px; font-size:8px; font-weight:500; color:rgba(247,242,232,.44); }
    .year { position:absolute; bottom:32px; left:24px; font-size:8px; letter-spacing:.12em; color:rgba(247,242,232,.48); }
    .copy { position:absolute; left:236px; top:72px; width:360px; }
    .eyebrow { margin:0 0 18px; font-size:10px; font-weight:700; letter-spacing:.18em; }
    h1 { margin:0; font-family:Georgia, 'Times New Roman', serif; font-size:86px; line-height:.91; font-weight:400; letter-spacing:-.065em; }
    .continue { margin-top:30px; display:inline-block; padding-bottom:7px; border-bottom:1px solid var(--navy); font-size:11px; font-weight:700; letter-spacing:.1em; }
    .art { position:absolute; left:548px; top:34px; width:1000px; height:720px; }
    svg { width:100%; height:100%; display:block; overflow:visible; }
    .hairline { stroke:rgba(14,26,46,.18); stroke-width:1; fill:none; }
    .rail { stroke:rgba(14,26,46,.35); stroke-width:1.2; fill:none; stroke-linecap:round; }
    .rail.sand { stroke:rgba(207,157,99,.76); }
    .tile { stroke:var(--navy); stroke-width:1; }
    .tile.navy { fill:var(--navy); }
    .tile.paper { fill:var(--white); }
    .tile.sand { fill:var(--sand); }
    .tile.slate { fill:var(--slate); }
    .plus { fill:none; stroke:var(--white); stroke-width:3; stroke-linecap:square; }
    .plus.dark { stroke:var(--navy); }
    .section-label { fill:var(--navy); font-size:11px; font-weight:700; letter-spacing:.17em; }
    .micro-label { fill:var(--slate); font-size:8px; font-weight:700; letter-spacing:.15em; }
    .meta { position:absolute; left:548px; top:26px; width:1000px; display:flex; justify-content:space-between; padding:0 2px 12px; border-bottom:1px solid rgba(14,26,46,.24); font-size:9px; letter-spacing:.15em; }
    .phase { font-weight:700; }
    .legend { position:absolute; left:548px; bottom:74px; right:52px; display:flex; justify-content:space-between; color:rgba(14,26,46,.38); font-size:8px; font-weight:700; letter-spacing:.18em; }
  </style>
</head>
<body>

        <path d="M360 478H668M412 430H620M464 382H568" class="hairline"/>
