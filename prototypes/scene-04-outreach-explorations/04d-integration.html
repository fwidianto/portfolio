<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scene 04.D: Lived Tokyo Commute — Zero-Reset Integration</title>
  <meta name="description" content="Integrated motion choreography for Chapter 02 Scene 04.D: Continuous zero-reset camera handoff from international flight arrival into the lived daily commute between Takatsu, Kawasaki and Tokyo Tech Ookayama.">

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-space: #030712;
      --bg-surface: rgba(15, 23, 42, 0.75);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-active: rgba(56, 189, 248, 0.50);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-faint: rgba(148, 163, 184, 0.45);
      --accent-warm: #fb923c;
      --accent-warm-dim: rgba(251, 146, 60, 0.25);
      --accent-cyan: #38bdf8;
      --accent-cyan-dim: rgba(56, 189, 248, 0.25);
      --accent-violet: #818cf8;
      --node-cold: rgba(148, 163, 184, 0.35);
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-space);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient Night Sky SVG background */
    .sky-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Top Reviewer Header Toolbar */
    .study-toolbar {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(10, 15, 26, 0.88);
      border: 1px solid var(--border-subtle);
      border-radius: 9999px;
      padding: 6px 14px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      max-width: 95vw;
      overflow-x: auto;
    }

    .toolbar-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding-right: 8px;
      border-right: 1px solid var(--border-subtle);
      white-space: nowrap;
    }

    .beat-selector {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .beat-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      padding: 4px 9px;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .beat-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.04);
    }

    .beat-btn.is-active {
      background: rgba(56, 189, 248, 0.14);
      border-color: rgba(56, 189, 248, 0.40);
      color: #38bdf8;
    }

    /* Mode Selector in Toolbar */
    .mode-selector {
      display: flex;
      align-items: center;
      gap: 4px;
      padding-left: 8px;
      border-left: 1px solid var(--border-subtle);
    }

    .mode-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .mode-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }

    .mode-btn.is-active {
      background: rgba(251, 146, 60, 0.16);
      border-color: rgba(251, 146, 60, 0.45);
      color: #fb923c;
    }

    /* Main Canvas Stage (Strictly Text-Free) */
    .stage-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Floating Timeline Playback Controls */
    .playback-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(10, 15, 26, 0.90);
      border: 1px solid var(--border-subtle);
      border-radius: 9999px;
      padding: 7px 18px;
      backdrop-filter: blur(14px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.65);
      width: calc(100% - 48px);
      max-width: 840px;
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.10);
      border-color: rgba(255, 255, 255, 0.20);
    }

    .ctrl-btn svg {
      width: 12px;
      height: 12px;
      fill: currentColor;
    }

    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-grow: 1;
    }

    .beat-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.28);
      padding: 2px 8px;
      border-radius: 9999px;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }

    .time-slider {
      flex-grow: 1;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    .time-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.8);
      border: 2px solid #030712;
      transition: transform 0.1s ease;
    }

    .time-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .time-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      min-width: 96px;
      text-align: right;
    }

    .speed-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .speed-btn:hover {
      color: var(--text-main);
    }

    .speed-btn.is-active {
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.35);
      background: rgba(56, 189, 248, 0.10);
    }

    @media (max-width: 768px) {
      .toolbar-title { display: none; }
      .study-toolbar { top: 8px; padding: 4px 10px; }
      .beat-btn { font-size: 10px; padding: 3px 7px; }
      .playback-bar { bottom: 12px; padding: 6px 12px; gap: 8px; width: calc(100% - 24px); }
      .beat-pill { display: none; }
      .speed-btn { display: none; }
    }
  </style>
</head>

      // MATHEMATICAL HELPER FUNCTIONS

      function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
      }

      function easeInOutQuad(val) {
        return val < 0.5 ? 2 * val * val : 1 - Math.pow(-2 * val + 2, 2) / 2;
      }

      function mapSegmentProgress(val, uStart, uEnd, sStart, sEnd) {
        if (val <= uStart) return sStart;
        if (val >= uEnd) return sEnd;
        const t = (val - uStart) / (uEnd - uStart);
        return sStart + (sEnd - sStart) * easeInOutQuad(t);
      }

      function getControlPoint(x1, y1, x2, y2) {
        const mx = (x1 + x2) * 0.5;
        const my = (y1 + y2) * 0.5;
        const dx = x2 - x1;
        const dy = y2 - y1;
        const len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len;
        const ny = dx / len;
        const bow = len * 0.08;
        return { x: mx + nx * bow, y: my + ny * bow };
      }

      function getBezierPoint(p0, p1, p2, u) {
        const t = clamp(u, 0, 1);
        const mt = 1 - t;
        return {
          x: mt * mt * p0.x + 2 * mt * t * p1.x + t * t * p2.x,
          y: mt * mt * p0.y + 2 * mt * t * p1.y + t * t * p2.y
        };
      }

      function getBezierTangent(p0, p1, p2, u) {
        const t = clamp(u, 0, 1);
        const mt = 1 - t;
        const dx = 2 * mt * (p1.x - p0.x) + 2 * t * (p2.x - p1.x);
        const dy = 2 * mt * (p1.y - p0.y) + 2 * t * (p2.y - p1.y);
        return Math.atan2(dy, dx);
      }

      function getPathPointAndHeading(path, exactIdx) {
        const N = path.length;
        const iLow = Math.max(0, Math.min(N - 1, Math.floor(exactIdx)));
        const iHigh = Math.max(0, Math.min(N - 1, iLow + 1));
        const frac = exactIdx - iLow;

        const x = path[iLow].x + (path[iHigh].x - path[iLow].x) * frac;
        const y = path[iLow].y + (path[iHigh].y - path[iLow].y) * frac;

        const iAhead = Math.min(N - 1, iLow + 2);
        const iBehind = Math.max(0, iLow - 1);
        const dx = path[iAhead].x - path[iBehind].x;
        const dy = path[iAhead].y - path[iBehind].y;
        const angle = Math.atan2(dy, dx);

        const dxAhead = path[iAhead].x - path[iLow].x;
        const dyAhead = path[iAhead].y - path[iLow].y;
        const angleAhead = Math.atan2(dyAhead, dxAhead);

        const dxBehind = path[iLow].x - path[iBehind].x;
        const dyBehind = path[iLow].y - path[iBehind].y;
        const angleBehind = Math.atan2(dyBehind, dxBehind);

        let dAngle = angleAhead - angleBehind;
        while (dAngle > Math.PI) dAngle -= Math.PI * 2;
        while (dAngle < -Math.PI) dAngle += Math.PI * 2;

        const tilt = clamp(dAngle * 3.2, -0.21, 0.21);
        return { x, y, angle, tilt };
      }

      // ======================================================================
      // CAMERA & COORDINATE PROJECTION ENGINE
      // ======================================================================
      function getTokyoMercatorParams() {
        const isMobile = width < 768;
        const centerLon = 139.6405;
        const centerLat = 35.5985;
        const zoom = isMobile ? 12.2 : 13.4;
        const s = 256 * Math.pow(2, zoom);

        function lonToWorldX(lon) { return ((lon + 180) / 360) * s; }
        function latToWorldY(lat) {
          const sinLat = Math.sin(lat * DEG2RAD);
          const clampedSin = clamp(sinLat, -0.9999, 0.9999);
          const rad = Math.log((1 + clampedSin) / (1 - clampedSin));
          return (0.5 - rad / (4 * Math.PI)) * s;
        }

        const centerWorldX = lonToWorldX(centerLon);
        const centerWorldY = latToWorldY(centerLat);
        const originX = width * 0.5 - centerWorldX;
        const originY = height * (isMobile ? 0.48 : 0.50) - centerWorldY;

        return { originX, originY, lonToWorldX, latToWorldY };
      }

      function projectTokyo(lon, lat) {
        const { originX, originY, lonToWorldX, latToWorldY } = getTokyoMercatorParams();
        return {
          x: originX + lonToWorldX(lon),
          y: originY + latToWorldY(lat)
        };
      }

      // ======================================================================
      // APPROVED F2 EDITORIAL TRUE-NORTH ATLAS PROJECTION (Jakarta -> Tokyo)
      // ======================================================================
      function toMercator(lon, lat) {
        const x = lon * DEG2RAD;
        const sinLat = Math.sin(lat * DEG2RAD);
        const clampedSin = clamp(sinLat, -0.9999, 0.9999);
        const y = Math.log((1 + clampedSin) / (1 - clampedSin)) * 0.5;
        return { x, y };
      }

      function projectTrueNorthAtlas(lon, lat) {
        const isMobile = width < 768;
        const centerLon = isMobile ? 123.8 : 121.5;
        const centerLat = isMobile ? 15.0 : 16.0;
        const mCenter = toMercator(centerLon, centerLat);

        const mPt = toMercator(lon, lat);
        const scale = isMobile ? (height * 0.72) : (height * 1.02);

        const cx = width * 0.50;
        const cy = height * (isMobile ? 0.50 : 0.52);

        return {
          x: cx + (mPt.x - mCenter.x) * scale,
          y: cy - (mPt.y - mCenter.y) * scale
        };
      }

      // ======================================================================
      // RENDERING MODULE: CACHED ROADBEDS & WATERWAYS (C1 + C2 Bridges)
      // ======================================================================
      function buildCachedRoadsCanvas() {
        if (!cachedRoadsCanvas) {
          cachedRoadsCanvas = document.createElement('canvas');
        }
        cachedRoadsCanvas.width = Math.floor(width * dpr);
        cachedRoadsCanvas.height = Math.floor(height * dpr);
        const cctx = cachedRoadsCanvas.getContext('2d');
        cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        cctx.clearRect(0, 0, width, height);
        const isMobile = width < 768;

        // 1. Municipal Ward Territories (Kawasaki City & Tokyo Metropolis Grounding)
        if (tokyoBoundariesData) {
          cctx.save();
          cctx.fillStyle = 'rgba(18, 26, 44, 0.45)';
          cctx.strokeStyle = 'rgba(148, 163, 184, 0.12)';
          cctx.lineWidth = 0.8;
          cctx.setLineDash([4, 4]);

          const renderWard = (w) => {
            if (!w.coordinates) return;
            w.coordinates.forEach(poly => {
              poly.forEach(ring => {
                if (!ring || ring.length < 3) return;
                const p0 = projectTokyo(ring[0][0], ring[0][1]);
                cctx.beginPath();
                cctx.moveTo(p0.x, p0.y);
                for (let i = 1; i < ring.length; i++) {
                  const pi = projectTokyo(ring[i][0], ring[i][1]);
                  cctx.lineTo(pi.x, pi.y);
                }
                cctx.closePath();
                cctx.fill();
                cctx.stroke();
              });
            });
          };

          if (tokyoBoundariesData.kawasakiWards) tokyoBoundariesData.kawasakiWards.forEach(renderWard);
          if (tokyoBoundariesData.tokyoWards) tokyoBoundariesData.tokyoWards.forEach(renderWard);
          cctx.restore();
        }

        if (tokyoRoadsData) {
          // 2. Tama River Fluvial Morphology (C1 Riverbed Polygons + Tributaries + Main Line)
          cctx.save();
          if (tokyoRoadsData.riverPolygons && tokyoRoadsData.riverPolygons.length > 0) {
            cctx.fillStyle = 'rgba(56, 189, 248, 0.12)';
            cctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
            cctx.lineWidth = 1.0;
            tokyoRoadsData.riverPolygons.forEach(ring => {
              if (!ring || ring.length < 3) return;
              cctx.beginPath();
              const p0 = projectTokyo(ring[0][0], ring[0][1]);
              cctx.moveTo(p0.x, p0.y);
              for (let i = 1; i < ring.length; i++) {
                const pi = projectTokyo(ring[i][0], ring[i][1]);
                cctx.lineTo(pi.x, pi.y);
              }
              cctx.closePath();
              cctx.fill();
              cctx.stroke();
            });
          }

          if (tokyoRoadsData.tributaries && tokyoRoadsData.tributaries.length > 0) {
            cctx.strokeStyle = 'rgba(56, 189, 248, 0.20)';
            cctx.lineWidth = 0.85;
            cctx.beginPath();
            tokyoRoadsData.tributaries.forEach(seg => {
              if (seg.length < 2) return;
              const p0 = projectTokyo(seg[0][0], seg[0][1]);
              cctx.moveTo(p0.x, p0.y);
              for (let i = 1; i < seg.length; i++) {
                const pi = projectTokyo(seg[i][0], seg[i][1]);
                cctx.lineTo(pi.x, pi.y);
              }
            });
            cctx.stroke();
          }

          const tamaMain = tokyoRoadsData.tamaMainLines || tokyoRoadsData.riverLines || [];
          if (tamaMain.length > 0) {
            cctx.strokeStyle = 'rgba(56, 189, 248, 0.45)';
            cctx.lineWidth = 1.3;
            cctx.beginPath();
            tamaMain.forEach(seg => {
              if (seg.length < 2) return;
              const p0 = projectTokyo(seg[0][0], seg[0][1]);
              cctx.moveTo(p0.x, p0.y);
              for (let i = 1; i < seg.length; i++) {
                const pi = projectTokyo(seg[i][0], seg[i][1]);
                cctx.lineTo(pi.x, pi.y);
              }
            });
            cctx.stroke();
          }
          cctx.restore();

          // 3. C2-Style Engineered Bridge Spans at Critical River Crossings
          cctx.save();
          const marukoPt = projectTokyo(139.6645, 35.5835);
          const futakoPt = projectTokyo(139.6268, 35.6118);
          const viaductPt = projectTokyo(139.6285, 35.6122);

          const drawBridgeStructure = (pt, angle, bridgeWidth = 26) => {
            cctx.save();
            cctx.translate(pt.x, pt.y);
            cctx.rotate(angle);
            cctx.fillStyle = '#1e293b';
            cctx.strokeStyle = 'rgba(241, 245, 249, 0.65)';
            cctx.lineWidth = 1.4;
            cctx.beginPath();
            cctx.rect(-bridgeWidth * 0.5, -3, bridgeWidth, 6);
            cctx.fill();
            cctx.stroke();
            cctx.fillStyle = '#38bdf8';
            cctx.fillRect(-bridgeWidth * 0.45, -4.5, 3, 9);
            cctx.fillRect(bridgeWidth * 0.45 - 3, -4.5, 3, 9);
            cctx.restore();
          };

          drawBridgeStructure(marukoPt, 0.85, 28);   // Maruko Bridge (Nakahara-kaido bike crossing)
          drawBridgeStructure(futakoPt, -0.45, 24);  // Futako Bridge (Route 246)
          drawBridgeStructure(viaductPt, -0.35, 26); // Tokyu Oimachi rail viaduct
          cctx.restore();

          // 4. Metropolitan Street Grain (Secondary & Tertiary Roads)
          cctx.save();
          const secondaryRoads = (tokyoRoadsData.secondary || []).filter(seg => seg.length >= 3);
          const tertiaryRoads = (tokyoRoadsData.tertiary || []).filter(seg => {
            if (seg.length < 3) return false;
            const midLon = seg[Math.floor(seg.length / 2)][0];
            const midLat = seg[Math.floor(seg.length / 2)][1];
            return midLon >= 139.59 && midLon <= 139.70 && midLat >= 35.58 && midLat <= 35.63;
          });
          cctx.strokeStyle = 'rgba(148, 163, 184, 0.08)';
          cctx.lineWidth = 0.55;
          cctx.beginPath();
          [...secondaryRoads, ...tertiaryRoads].forEach(seg => {
            const p0 = projectTokyo(seg[0][0], seg[0][1]);
            cctx.moveTo(p0.x, p0.y);
            for (let i = 1; i < seg.length; i++) {
              const pi = projectTokyo(seg[i][0], seg[i][1]);
              cctx.lineTo(pi.x, pi.y);
            }
          });
          cctx.stroke();

          // 5. Selected Primary Arterials (Route 246, Meguro-dori, Kan-nana)
          if (tokyoRoadsData.primary && tokyoRoadsData.primary.length > 0) {
            cctx.strokeStyle = 'rgba(148, 163, 184, 0.22)';
            cctx.lineWidth = 1.15;
            cctx.beginPath();
            tokyoRoadsData.primary.forEach(seg => {
              if (seg.length < 4) return;
              const p0 = projectTokyo(seg[0][0], seg[0][1]);
              cctx.moveTo(p0.x, p0.y);
              for (let i = 1; i < seg.length; i++) {
                const pi = projectTokyo(seg[i][0], seg[i][1]);
                cctx.lineTo(pi.x, pi.y);
              }
            });
            cctx.stroke();
          }

          // 6. Contextual Railway Network (Tokyu lines & JR tracks)
          if (tokyoRoadsData.railways && tokyoRoadsData.railways.length > 0) {
            cctx.strokeStyle = 'rgba(129, 140, 248, 0.15)';
            cctx.lineWidth = 1.0;
            cctx.setLineDash([3, 4]);
            cctx.beginPath();
            tokyoRoadsData.railways.filter(seg => seg.length >= 3).forEach(seg => {
              const p0 = projectTokyo(seg[0][0], seg[0][1]);
              cctx.moveTo(p0.x, p0.y);
              for (let i = 1; i < seg.length; i++) {
                const pi = projectTokyo(seg[i][0], seg[i][1]);
                cctx.lineTo(pi.x, pi.y);
              }
            });
            cctx.stroke();
            cctx.setLineDash([]);
          }
          cctx.restore();

          // 7. Active Commute Physical Roadbeds (Hierarchy & Dominance)
          const outRoad = (tokyoRoadsData.commuteOutbound && tokyoRoadsData.commuteOutbound.length > 1)
            ? tokyoRoadsData.commuteOutbound : COMMUTE_OUTBOUND_COORDS;
          const retRoad = (tokyoRoadsData.commuteReturn && tokyoRoadsData.commuteReturn.length > 1)
            ? tokyoRoadsData.commuteReturn : COMMUTE_RETURN_COORDS;

          // Road Outer Casing (Prominent framing)
          cctx.strokeStyle = 'rgba(148, 163, 184, 0.25)';
          cctx.lineWidth = 3.8;
          cctx.lineCap = 'round';
          cctx.lineJoin = 'round';
          cctx.beginPath();
          if (outRoad.length > 1) {
            const p0 = projectTokyo(outRoad[0][0], outRoad[0][1]);
            cctx.moveTo(p0.x, p0.y);
            for (let i = 1; i < outRoad.length; i++) {
              const pi = projectTokyo(outRoad[i][0], outRoad[i][1]);
              cctx.lineTo(pi.x, pi.y);
            }
          }
          if (retRoad.length > 1) {
            const p0 = projectTokyo(retRoad[0][0], retRoad[0][1]);
            cctx.moveTo(p0.x, p0.y);
            for (let i = 1; i < retRoad.length; i++) {
              const pi = projectTokyo(retRoad[i][0], retRoad[i][1]);
              cctx.lineTo(pi.x, pi.y);
            }
          }
          cctx.stroke();

          // Outbound Roadbed: Silver-white solid
          cctx.strokeStyle = 'rgba(241, 245, 249, 0.45)';
          cctx.lineWidth = 1.8;
          cctx.beginPath();
          if (outRoad.length > 1) {
            const p0 = projectTokyo(outRoad[0][0], outRoad[0][1]);
            cctx.moveTo(p0.x, p0.y);
            for (let i = 1; i < outRoad.length; i++) {
              const pi = projectTokyo(outRoad[i][0], outRoad[i][1]);
              cctx.lineTo(pi.x, pi.y);
            }
          }
          cctx.stroke();

          // Return Roadbed: Luminous cyan-slate dashes
          cctx.strokeStyle = 'rgba(147, 197, 253, 0.38)';
          cctx.lineWidth = 1.6;
          cctx.setLineDash([5, 5]);
          cctx.beginPath();
          if (retRoad.length > 1) {
            const p0 = projectTokyo(retRoad[0][0], retRoad[0][1]);
            cctx.moveTo(p0.x, p0.y);
            for (let i = 1; i < retRoad.length; i++) {
              const pi = projectTokyo(retRoad[i][0], retRoad[i][1]);
              cctx.lineTo(pi.x, pi.y);
            }
          }
          cctx.stroke();
          cctx.setLineDash([]);

          // 8. Commuter Transit Trackbeds
          // 8a. JR Nambu Line Trackbed
          if (transitRailNambu && transitRailNambu.length > 1) {
            cctx.strokeStyle = 'rgba(129, 140, 248, 0.20)';
            cctx.lineWidth = 3.4;
            cctx.lineCap = 'round';
            cctx.beginPath();
            const p0 = projectTokyo(transitRailNambu[0].lon, transitRailNambu[0].lat);
            cctx.moveTo(p0.x, p0.y);
            for (let i = 1; i < transitRailNambu.length; i++) {
              const pi = projectTokyo(transitRailNambu[i].lon, transitRailNambu[i].lat);
              cctx.lineTo(pi.x, pi.y);
            }
            cctx.stroke();

            // Track dashes
            cctx.strokeStyle = 'rgba(129, 140, 248, 0.40)';
            cctx.lineWidth = 1.5;
            cctx.setLineDash([4, 3]);
            cctx.beginPath();
            cctx.moveTo(p0.x, p0.y);
            for (let i = 1; i < transitRailNambu.length; i++) {
              const pi = projectTokyo(transitRailNambu[i].lon, transitRailNambu[i].lat);
              cctx.lineTo(pi.x, pi.y);
            }
            cctx.stroke();
            cctx.setLineDash([]);
          }

          // 8b. Tokyu Oimachi Line Trackbed
          if (transitRailOimachi && transitRailOimachi.length > 1) {
            cctx.strokeStyle = 'rgba(6, 182, 212, 0.20)';
            cctx.lineWidth = 3.4;
            cctx.lineCap = 'round';
            cctx.beginPath();
            const p0 = projectTokyo(transitRailOimachi[0].lon, transitRailOimachi[0].lat);
            cctx.moveTo(p0.x, p0.y);
            for (let i = 1; i < transitRailOimachi.length; i++) {
              const pi = projectTokyo(transitRailOimachi[i].lon, transitRailOimachi[i].lat);
              cctx.lineTo(pi.x, pi.y);
            }
            cctx.stroke();

            // Track dashes
            cctx.strokeStyle = 'rgba(6, 182, 212, 0.40)';
            cctx.lineWidth = 1.5;
            cctx.setLineDash([4, 3]);
            cctx.beginPath();
            cctx.moveTo(p0.x, p0.y);
            for (let i = 1; i < transitRailOimachi.length; i++) {
              const pi = projectTokyo(transitRailOimachi[i].lon, transitRailOimachi[i].lat);
              cctx.lineTo(pi.x, pi.y);
            }
            cctx.stroke();
            cctx.setLineDash([]);
          }

          // 8c. Walking Connectors
          if (transitWalkOrigin && transitWalkOrigin.length > 1) {
            cctx.strokeStyle = 'rgba(241, 245, 249, 0.22)';
            cctx.lineWidth = 1.2;
            cctx.setLineDash([2, 3]);
            cctx.beginPath();
            const p0 = projectTokyo(transitWalkOrigin[0].lon, transitWalkOrigin[0].lat);
            cctx.moveTo(p0.x, p0.y);
            for (let i = 1; i < transitWalkOrigin.length; i++) {
              const pi = projectTokyo(transitWalkOrigin[i].lon, transitWalkOrigin[i].lat);
              cctx.lineTo(pi.x, pi.y);
            }
            cctx.stroke();
            cctx.setLineDash([]);
          }

          if (transitWalkDest && transitWalkDest.length > 1) {
            cctx.strokeStyle = 'rgba(241, 245, 249, 0.22)';
            cctx.lineWidth = 1.2;
            cctx.setLineDash([2, 3]);
            cctx.beginPath();
            const p0 = projectTokyo(transitWalkDest[0].lon, transitWalkDest[0].lat);
            cctx.moveTo(p0.x, p0.y);
            for (let i = 1; i < transitWalkDest.length; i++) {
              const pi = projectTokyo(transitWalkDest[i].lon, transitWalkDest[i].lat);
              cctx.lineTo(pi.x, pi.y);
            }
            cctx.stroke();
            cctx.setLineDash([]);
          }
        }

        // 9. Soft Atmospheric Edge Vignette (Editorial radial falloff - eliminates cutoffs)
        const cx = width * 0.5;
        const cy = height * (isMobile ? 0.48 : 0.50);
        const minR = Math.min(width, height) * 0.22;
        const maxR = Math.min(width, height) * 0.50;
        const vignetteGrad = cctx.createRadialGradient(cx, cy, minR, cx, cy, maxR);
        vignetteGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
        vignetteGrad.addColorStop(0.60, 'rgba(0, 0, 0, 0.15)');
        vignetteGrad.addColorStop(0.88, 'rgba(0, 0, 0, 0.85)');
        vignetteGrad.addColorStop(1.0, 'rgba(0, 0, 0, 1.0)');

        cctx.globalCompositeOperation = 'destination-out';
        cctx.fillStyle = vignetteGrad;
        cctx.fillRect(0, 0, width, height);
        cctx.globalCompositeOperation = 'source-over';

        cachedRoadsWidth = width;
        cachedRoadsHeight = height;
      }

      // 2. Stylized Bicycle Commuter (Physical wheel rotation, pedaling cadence, lean angle)
      function drawBicycleCommuter(c, x, y, angle, tiltAngle, wheelRot, isResting, isMobile, themeColor = '#fb923c') {
        c.save();
        c.translate(x, y);

        let drawAngle = angle;
        let flipX = false;
        if (Math.cos(angle) < 0) {
          drawAngle = angle - Math.PI;
          flipX = true;
        }
        c.rotate(drawAngle);
        if (flipX) c.scale(-1, 1);
        if (tiltAngle) c.rotate(tiltAngle);

        const s = isMobile ? 0.95 : 1.12;
        c.scale(s, s);

        // Ground Aura
        const auraR = isMobile ? 15 : 20;
        const aura = c.createRadialGradient(0, -3, 1, 0, -3, auraR);
        if (themeColor === '#38bdf8') {
          aura.addColorStop(0, 'rgba(56, 189, 248, 0.20)');
          aura.addColorStop(0.65, 'rgba(56, 189, 248, 0.05)');
          aura.addColorStop(1, 'rgba(56, 189, 248, 0)');
        } else {
          aura.addColorStop(0, 'rgba(249, 115, 22, 0.20)');
          aura.addColorStop(0.65, 'rgba(249, 115, 22, 0.05)');
          aura.addColorStop(1, 'rgba(249, 115, 22, 0)');
        }
        c.fillStyle = aura;
        c.beginPath();
        c.arc(0, -3, auraR, 0, Math.PI * 2);
        c.fill();

        // Forward Headlight Beam
        if (!isResting) {
          const hGrad = c.createRadialGradient(8, 0, 1, 26, 0, 16);
          hGrad.addColorStop(0, 'rgba(255, 245, 215, 0.40)');
          hGrad.addColorStop(0.5, 'rgba(255, 225, 175, 0.12)');
          hGrad.addColorStop(1, 'rgba(255, 225, 175, 0)');
          c.fillStyle = hGrad;
          c.beginPath();
          c.moveTo(8, -1.5);
          c.lineTo(28, -9);
          c.lineTo(28, 9);
          c.lineTo(8, 1.5);
          c.closePath();
          c.fill();
        }

        // Spoked Wheels
        const wheelR = 6.2;
        const rX = -8.5, rY = 2.5;
        const fX = 8.5, fY = 2.5;

        c.strokeStyle = '#94a3b8';
        c.lineWidth = 1.2;
        c.beginPath();
        c.arc(rX, rY, wheelR, 0, Math.PI * 2);
        c.arc(fX, fY, wheelR, 0, Math.PI * 2);
        c.stroke();

        c.strokeStyle = 'rgba(203, 213, 225, 0.55)';
        c.lineWidth = 0.75;
        c.beginPath();
        for (let i = 0; i < 4; i++) {
          const a = wheelRot + (i * Math.PI) / 2;
          const cosA = Math.cos(a) * (wheelR - 0.5);
          const sinA = Math.sin(a) * (wheelR - 0.5);
          c.moveTo(rX - cosA, rY - sinA);
          c.lineTo(rX + cosA, rY + sinA);
          c.moveTo(fX - cosA, fY - sinA);
          c.lineTo(fX + cosA, fY + sinA);
        }
        c.stroke();

        c.fillStyle = themeColor;
        c.beginPath();
        c.arc(rX, rY, 1.2, 0, Math.PI * 2);
        c.arc(fX, fY, 1.2, 0, Math.PI * 2);
        c.fill();

        // Bicycle Frame
        const bbX = 0, bbY = 2.5;
        const seatX = -3.0, seatY = -6.5;
        const headX = 5.5, headY = -6.5;

        c.strokeStyle = themeColor === '#38bdf8' ? 'rgba(56, 189, 248, 0.95)' : 'rgba(251, 146, 60, 0.98)';
        c.lineWidth = 1.35;
        c.lineCap = 'round';
        c.lineJoin = 'round';
        c.beginPath();
        c.moveTo(bbX, bbY); c.lineTo(rX, rY);
        c.moveTo(seatX, seatY); c.lineTo(rX, rY);
        c.moveTo(bbX, bbY); c.lineTo(seatX, seatY);
        c.moveTo(bbX, bbY); c.lineTo(headX, headY);
        c.moveTo(seatX, seatY); c.lineTo(headX, headY);
        c.moveTo(headX, headY); c.lineTo(fX, fY);
        c.stroke();

        // Saddle & Handlebars
        c.strokeStyle = '#f8fafc';
        c.lineWidth = 1.6;
        c.beginPath();
        c.moveTo(seatX - 2.5, seatY - 1.0);
        c.lineTo(seatX + 1.8, seatY - 0.8);
        c.stroke();

        c.lineWidth = 1.4;
        c.beginPath();
        c.moveTo(headX, headY);
        c.lineTo(headX + 1.2, headY - 2.5);
        c.lineTo(headX + 2.8, headY - 1.8);
        c.stroke();

        // Cyclist Silhouette
        const hipX = seatX, hipY = seatY - 1.5;
        const shoulderX = 2.4, shoulderY = -12.5;

        c.strokeStyle = '#ffffff';
        c.lineWidth = 2.4;
        c.beginPath();
        c.moveTo(hipX, hipY);
        c.lineTo(shoulderX, shoulderY);
        c.stroke();

        c.fillStyle = '#ffffff';
        c.beginPath();
        c.arc(shoulderX + 1.4, shoulderY - 3.2, 2.4, 0, Math.PI * 2);
        c.fill();

        c.strokeStyle = 'rgba(241, 245, 249, 0.90)';
        c.lineWidth = 1.3;
        c.beginPath();
        c.moveTo(shoulderX, shoulderY + 0.5);
        c.lineTo(headX + 2.2, headY - 2.0);
        c.stroke();

        // Pedaling Legs
        const crankAngle = isResting ? (Math.PI * 0.5) : (wheelRot * 0.5);
        const crankL = 2.5;
        const pedalX = bbX + Math.cos(crankAngle) * crankL;
        const pedalY = bbY + Math.sin(crankAngle) * crankL;
        const kneeX = (hipX + pedalX) * 0.5 + 2.8;
        const kneeY = (hipY + pedalY) * 0.5 - 1.8;

        c.strokeStyle = themeColor === '#38bdf8' ? 'rgba(186, 230, 253, 0.95)' : 'rgba(255, 205, 150, 0.95)';
        c.lineWidth = 1.5;
        c.beginPath();
        c.moveTo(hipX, hipY);
        c.lineTo(kneeX, kneeY);
        c.lineTo(pedalX, pedalY);
        c.stroke();

        c.restore();
      }

      // 3. Commuter Train EMU Silhouette (JR Nambu / Tokyu Oimachi)
      function drawMetroTrain(c, x, y, angle, color = '#818cf8', isMoving = true, isMobile = false) {
        c.save();
        c.translate(x, y);
        c.rotate(angle);

        const s = isMobile ? 0.95 : 1.15;
        c.scale(s, s);

        // Ground Aura
        const auraR = 18;
        const aura = c.createRadialGradient(0, 0, 1, 0, 0, auraR);
        if (color === '#06b6d4' || color === '#38bdf8') {
          aura.addColorStop(0, 'rgba(6, 182, 212, 0.32)');
          aura.addColorStop(0.6, 'rgba(6, 182, 212, 0.08)');
          aura.addColorStop(1, 'rgba(6, 182, 212, 0)');
        } else {
          aura.addColorStop(0, 'rgba(129, 140, 248, 0.32)');
          aura.addColorStop(0.6, 'rgba(129, 140, 248, 0.08)');
          aura.addColorStop(1, 'rgba(129, 140, 248, 0)');
        }
        c.fillStyle = aura;
        c.beginPath();
        c.arc(0, 0, auraR, 0, Math.PI * 2);
        c.fill();

        // Forward Headlight Beam
        if (isMoving) {
          const hGrad = c.createRadialGradient(14, 0, 1, 34, 0, 14);
          hGrad.addColorStop(0, 'rgba(255, 250, 225, 0.50)');
          hGrad.addColorStop(0.5, 'rgba(255, 235, 180, 0.16)');
          hGrad.addColorStop(1, 'rgba(255, 235, 180, 0)');
          c.fillStyle = hGrad;
          c.beginPath();
          c.moveTo(14, -2.5);
          c.lineTo(36, -9);
          c.lineTo(36, 9);
          c.lineTo(14, 2.5);
          c.closePath();
          c.fill();
        }

        // Train Car Chassis
        const carL = 26;
        const carW = 9.2;
        const halfL = carL * 0.5;
        const halfW = carW * 0.5;

        c.fillStyle = '#cbd5e1';
        c.strokeStyle = '#f8fafc';
        c.lineWidth = 0.8;
        c.beginPath();
        c.roundRect(-halfL, -halfW, carL, carW, [2, 4.5, 4.5, 2]);
        c.fill();
        c.stroke();

        // Line accent stripe
        c.fillStyle = color;
        c.fillRect(-halfL + 2, -halfW + 1.2, carL - 4, 1.8);
        c.fillRect(-halfL + 2, halfW - 3.0, carL - 4, 1.8);

        // Windshield
        c.fillStyle = '#0f172a';
        c.beginPath();
        c.roundRect(halfL - 5.5, -halfW + 1.5, 4.5, carW - 3, [1, 3, 3, 1]);
        c.fill();

        c.strokeStyle = 'rgba(255, 255, 255, 0.65)';
        c.lineWidth = 0.7;
        c.beginPath();
        c.moveTo(halfL - 4, -halfW + 2.5);
        c.lineTo(halfL - 2, 0);
        c.stroke();

        // Passenger Windows
        c.fillStyle = '#1e293b';
        c.fillRect(-halfL + 4, -halfW + 2.0, 3.5, 1.6);
        c.fillRect(-halfL + 9.5, -halfW + 2.0, 3.5, 1.6);
        c.fillRect(-halfL + 15, -halfW + 2.0, 3.5, 1.6);
        c.fillRect(-halfL + 4, halfW - 3.6, 3.5, 1.6);
        c.fillRect(-halfL + 9.5, halfW - 3.6, 3.5, 1.6);
        c.fillRect(-halfL + 15, halfW - 3.6, 3.5, 1.6);

        // Rooftop AC Module
        c.fillStyle = '#64748b';
        c.fillRect(-4, -1.8, 8, 3.6);

        c.restore();
      }

      // 4. Vector Airliner (From frozen 04.C)
      function drawVectorAirliner(x, y, angle, altitudeNorm, isMobile, dissolutionAlpha = 1.0) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);

        const baseScale = isMobile ? 0.65 : 0.85;
        const altScale = baseScale * (0.65 + 0.35 * altitudeNorm);
        ctx.scale(altScale, altScale);
        ctx.globalAlpha = dissolutionAlpha;

        // Shadow
        if (altitudeNorm > 0.05) {
          ctx.save();
          const shadowOffsetX = 12 * altitudeNorm;
          const shadowOffsetY = 16 * altitudeNorm;
          ctx.translate(shadowOffsetX, shadowOffsetY);
          ctx.scale(0.85, 0.85);
          ctx.fillStyle = `rgba(3, 7, 18, ${0.45 * altitudeNorm})`;
          ctx.beginPath();
          ctx.moveTo(0, -16);
          ctx.lineTo(16, 5);
          ctx.lineTo(0, 14);
          ctx.lineTo(-16, 5);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }

        // Wings
        ctx.fillStyle = '#e2e8f0';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.0;
        ctx.beginPath();
        ctx.moveTo(0, -14);
        ctx.lineTo(-1, -1);
        ctx.lineTo(-17, 7);
        ctx.lineTo(-17, 5);
        ctx.lineTo(-2, -5);
        ctx.lineTo(2, -5);
        ctx.lineTo(17, 5);
        ctx.lineTo(17, 7);
        ctx.lineTo(1, -1);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Winglets
        ctx.fillStyle = '#fb923c';
        ctx.fillRect(-18, 3, 2, 4);
        ctx.fillRect(16, 3, 2, 4);

        // Turbofans
        ctx.fillStyle = '#94a3b8';
        ctx.fillRect(-7.5, 0, 3, 6);
        ctx.fillRect(4.5, 0, 3, 6);

        // Horizontal Stabilizers
        ctx.fillStyle = '#cbd5e1';
        ctx.beginPath();
        ctx.moveTo(-1, 9);
        ctx.lineTo(-8, 14);
        ctx.lineTo(-8, 16);
        ctx.lineTo(0, 13);
        ctx.lineTo(8, 16);
        ctx.lineTo(8, 14);
        ctx.lineTo(1, 9);
        ctx.closePath();
        ctx.fill();

        // Fuselage
        ctx.fillStyle = '#f8fafc';
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.lineWidth = 0.9;
        ctx.beginPath();
        ctx.moveTo(0, -16);
        ctx.bezierCurveTo(2.8, -12, 3.2, 5, 2.0, 13);
        ctx.lineTo(0, 16);
        ctx.lineTo(-2.0, 13);
        ctx.bezierCurveTo(-3.2, 5, -2.8, -12, 0, -16);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Windshield
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.moveTo(0, -13);
        ctx.lineTo(1.8, -10.5);
        ctx.lineTo(-1.8, -10.5);
        ctx.closePath();
        ctx.fill();

        // Strobes
        const flashPhase = (Date.now() % 1000) / 1000;
        const strobeOn = flashPhase < 0.20;
        ctx.fillStyle = strobeOn ? '#ef4444' : 'rgba(239, 68, 68, 0.3)';
        ctx.beginPath();
        ctx.arc(-17, 5.5, strobeOn ? 2.2 : 1.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = strobeOn ? '#10b981' : 'rgba(16, 185, 129, 0.3)';
        ctx.beginPath();
        ctx.arc(17, 5.5, strobeOn ? 2.2 : 1.5, 0, Math.PI * 2);
        ctx.fill();

        const beaconPulse = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(Date.now() * 0.007));
        ctx.fillStyle = `rgba(245, 158, 11, ${beaconPulse})`;
        ctx.beginPath();
        ctx.arc(0, -2, 2.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      // 5. Dual Aerodynamic Contrails
      function drawDualContrails(p0, p1, p2, uCurrent, altitudeNorm, isMobile) {
        if (uCurrent <= 0.02 || altitudeNorm <= 0.05) return;
        const maxContrailU = 0.28;
        const uStart = Math.max(0.0, uCurrent - maxContrailU);
        const steps = 36;
        const engineOffset = (isMobile ? 0.95 : 1.20) * 6.0;

        for (let side = -1; side <= 1; side += 2) {
          ctx.beginPath();
          for (let i = 0; i <= steps; i++) {
            const uStep = uStart + (uCurrent - uStart) * (i / steps);
            const pt = getBezierPoint(p0, p1, p2, uStep);
            const tangent = getBezierTangent(p0, p1, p2, uStep);
            const nx = -Math.sin(tangent);
            const ny = Math.cos(tangent);
            const ex = pt.x + side * nx * engineOffset;
            const ey = pt.y + side * ny * engineOffset;
            if (i === 0) ctx.moveTo(ex, ey);
            else ctx.lineTo(ex, ey);
          }
          ctx.strokeStyle = `rgba(224, 242, 254, ${0.38 * altitudeNorm})`;
          ctx.lineWidth = 1.25;
          ctx.stroke();
        }
      }

      // ======================================================================
      // TRANSIT STATIONS DRAWING ROUTINE
      // ======================================================================
      function drawTransitStations(c, activeStationId, t, isMobile) {
        transitStations.forEach(st => {
          const pt = projectTokyo(st.lon, st.lat);
          const isCurrent = (st.id === activeStationId);

          c.save();
          if (st.role === 'transfer_station') {
            // Mizonokuchi Transfer Hub
            c.fillStyle = 'rgba(15, 23, 42, 0.92)';
            c.strokeStyle = 'rgba(165, 180, 252, 0.85)';
            c.lineWidth = 1.2;
            c.beginPath();
            c.roundRect(pt.x - 10, pt.y - 5.5, 20, 11, 5.5);
            c.fill();
            c.stroke();

            // JR Violet + Tokyu Cyan Dots
            c.fillStyle = '#818cf8';
            c.beginPath();
            c.arc(pt.x - 4.5, pt.y, 2.3, 0, Math.PI * 2);
            c.fill();

            c.fillStyle = '#06b6d4';
            c.beginPath();
            c.arc(pt.x + 4.5, pt.y, 2.3, 0, Math.PI * 2);
            c.fill();

            c.fillStyle = isCurrent ? '#ffffff' : '#e2e8f0';
            c.font = `600 ${isMobile ? 8.5 : 9.5}px 'Inter', sans-serif`;
            c.textAlign = 'center';
            c.textBaseline = 'top';
            c.shadowColor = 'rgba(3, 5, 8, 0.95)';
            c.shadowBlur = 4;
            c.fillText('Mizonokuchi', pt.x, pt.y + 9);
            c.shadowBlur = 0;

          } else {
            // Standard Station Waypoint
            const isOrigin = (st.role === 'origin_station');
            const isDest = (st.role === 'dest_station');
            const themeColor = (st.line === 'JR Nambu Line') ? '#818cf8' : '#06b6d4';
            const pulse = isCurrent ? (Math.sin(t * 5.0) + 1) * 0.5 : 0;

            if (isCurrent) {
              c.strokeStyle = themeColor === '#06b6d4' ? `rgba(6, 182, 212, ${0.4 + pulse * 0.4})` : `rgba(129, 140, 248, ${0.4 + pulse * 0.4})`;
              c.lineWidth = 1.6;
              c.beginPath();
              c.arc(pt.x, pt.y, 7 + pulse * 4, 0, Math.PI * 2);
              c.stroke();
            }

            c.fillStyle = 'rgba(15, 23, 42, 0.9)';
            c.strokeStyle = themeColor;
            c.lineWidth = 1.3;
            c.beginPath();
            c.arc(pt.x, pt.y, isOrigin || isDest ? 4.5 : 3.5, 0, Math.PI * 2);
            c.fill();
            c.stroke();

            c.fillStyle = themeColor;
            c.beginPath();
            c.arc(pt.x, pt.y, isOrigin || isDest ? 2.2 : 1.6, 0, Math.PI * 2);
            c.fill();

            c.fillStyle = isCurrent ? '#ffffff' : 'rgba(226, 232, 240, 0.85)';
            c.font = `500 ${isMobile ? 8.0 : 9.0}px 'Inter', sans-serif`;
            c.shadowColor = 'rgba(3, 5, 8, 0.95)';
            c.shadowBlur = 4;

            if (st.id === 'kuji') {
              c.textAlign = 'right';
              c.textBaseline = 'middle';
              c.fillText('Kuji', pt.x - 8, pt.y - 1);
            } else if (st.id === 'tsudayama' && !isMobile) {
              c.textAlign = 'left';
              c.textBaseline = 'top';
              c.fillText('Tsudayama', pt.x + 6, pt.y + 4);
            } else if (st.id === 'futako_tamagawa') {
              c.textAlign = 'center';
              c.textBaseline = 'bottom';
              c.fillText('Futako-Tamagawa', pt.x, pt.y - 7);
            } else if (st.id === 'jiyugaoka') {
              c.textAlign = 'center';
              c.textBaseline = isMobile ? 'top' : 'bottom';
              c.fillText('Jiyugaoka', pt.x, isMobile ? pt.y + 7 : pt.y - 7);
            } else if (st.id === 'ookayama') {
              c.textAlign = 'left';
              c.textBaseline = isMobile ? 'top' : 'middle';
              c.fillText('Ookayama', isMobile ? pt.x + 6 : pt.x + 8, isMobile ? pt.y + 6 : pt.y - 1);
            }
            c.shadowBlur = 0;
          }
          c.restore();
        });
      }

      // Station-by-station progression helpers
      function getNambuStationProgress(u) {
        if (u < 0.38) {
          const s = mapSegmentProgress(u, 0.0, 0.38, 0.0, 0.50);
          return { s, isMoving: true, stationId: (u > 0.22 ? 'tsudayama' : 'kuji') };
        } else if (u < 0.52) {
          return { s: 0.50, isMoving: false, stationId: 'tsudayama' };
        } else if (u < 0.94) {
          const s = mapSegmentProgress(u, 0.52, 0.94, 0.50, 1.0);
          return { s, isMoving: true, stationId: (u > 0.78 ? 'mizonokuchi' : 'tsudayama') };
        } else {
          return { s: 1.0, isMoving: false, stationId: 'mizonokuchi' };
        }
      }

      function getOimachiStationProgress(u) {
        if (u < 0.26) {
          const s = mapSegmentProgress(u, 0.0, 0.26, 0.0, 0.275);
          return { s, isMoving: true, stationId: (u > 0.16 ? 'futako_tamagawa' : 'mizonokuchi') };
        } else if (u < 0.36) {
          return { s: 0.275, isMoving: false, stationId: 'futako_tamagawa' };
        } else if (u < 0.68) {
          const s = mapSegmentProgress(u, 0.36, 0.68, 0.275, 0.80);
          return { s, isMoving: true, stationId: (u > 0.54 ? 'jiyugaoka' : 'futako_tamagawa') };
        } else if (u < 0.78) {
          return { s: 0.80, isMoving: false, stationId: 'jiyugaoka' };
        } else if (u < 0.95) {
          const s = mapSegmentProgress(u, 0.78, 0.95, 0.80, 1.0);
          return { s, isMoving: true, stationId: (u > 0.88 ? 'ookayama' : 'jiyugaoka') };
        } else {
          return { s: 1.0, isMoving: false, stationId: 'ookayama' };
        }
      }

      // ======================================================================
      // MAIN ANIMATION RENDER PIPELINE
      // ======================================================================
      function render(t) {
        ctx.clearRect(0, 0, width, height);
        const isMobile = width < 768;

        // Origin & Destination in Approved F2 Editorial True-North Atlas (CGK -> HND)
        const originPt = projectTrueNorthAtlas(CGK_LON, CGK_LAT);
        const targetPt = projectTrueNorthAtlas(HND_LON, HND_LAT);
        const mainCp = getControlPoint(originPt.x, originPt.y, targetPt.x, targetPt.y, 0.10);

        // Metropolitan Commute Anchors
        const placePt = projectTokyo(PLACE_LON, PLACE_LAT);
        const univPt = projectTokyo(UNIV_LON, UNIV_LAT);

        let currentBeatText = 'C · FLIGHT DEPARTURE';

        // --------------------------------------------------------------------
        // PHASE 1: INTERNATIONAL FLIGHT JOURNEY (t = 0.0s – 8.0s)
        // --------------------------------------------------------------------
        if (t <= T_BRIDGE_START) {
          const uFlightTime = t / T_FLIGHT_END;
          let uFlight = 0.0;
          let altitudeNorm = 0.0;
          let geoAlpha = 1.0;
          let corridorAlpha = 0.70;

          if (t < 0.8) {
            currentBeatText = 'C0 · FLIGHT DEPARTURE';
            uFlight = 0.0;
            altitudeNorm = 0.0;
          } else if (t < 2.4) {
            currentBeatText = 'C1 · ASCENT & CLIMB';
            const p = (t - 0.8) / 1.6;
            uFlight = 0.22 * Math.pow(p, 1.8);
            altitudeNorm = Math.min(1.0, p * 1.08);
          } else if (t < 5.0) {
            currentBeatText = 'C2 · RESONANT CRUISE';
            const p = (t - 2.4) / 2.6;
            uFlight = 0.22 + 0.46 * p;
            altitudeNorm = 1.0;
          } else if (t < 7.2) {
            currentBeatText = 'C3 · TOKYO DESCENT';
            const p = (t - 5.0) / 2.2;
            const easeOut = 1 - Math.pow(1 - p, 2.2);
            uFlight = 0.68 + 0.30 * easeOut;
            altitudeNorm = Math.max(0.15, 1.0 - p * 0.85);
            corridorAlpha = 0.70 - p * 0.35;
          } else {
            currentBeatText = 'C4 · TOKYO TOUCHDOWN';
            uFlight = 1.0;
            altitudeNorm = 0.0;
            corridorAlpha = 0.22;
          }

          // 1. Editorial True-North Graticule Grid (meridians and parallels)
          if (geoAlpha > 0.01) {
            ctx.save();
            ctx.strokeStyle = `rgba(148, 163, 184, ${0.07 * geoAlpha})`;
            ctx.lineWidth = 0.65;

            for (let lat = -10; lat <= 45; lat += 10) {
              ctx.beginPath();
              for (let lon = 95; lon <= 150; lon += 5) {
                const pt = projectTrueNorthAtlas(lon, lat);
                if (lon === 95) ctx.moveTo(pt.x, pt.y);
                else ctx.lineTo(pt.x, pt.y);
              }
              ctx.stroke();
            }

            for (let lon = 100; lon <= 150; lon += 10) {
              ctx.beginPath();
              for (let lat = -10; lat <= 45; lat += 5) {
                const pt = projectTrueNorthAtlas(lon, lat);
                if (lat === -10) ctx.moveTo(pt.x, pt.y);
                else ctx.lineTo(pt.x, pt.y);
              }
              ctx.stroke();
            }
            ctx.restore();
          }

          // 2. Undistorted Solid Charcoal Landmasses with Archipelago Accents
          if (realCountriesData) {
            ctx.save();
            realCountriesData.forEach(country => {
              const isOriginCountry = (country.name === 'Indonesia');
              const isDestCountry = (country.name === 'Japan');
              const isInterCountry = (country.name === 'Philippines' || country.name === 'Taiwan');

              ctx.fillStyle = isOriginCountry ? 'rgba(251, 146, 60, 0.12)'
                : isDestCountry ? 'rgba(56, 189, 248, 0.12)'
                : isInterCountry ? 'rgba(30, 45, 72, 0.85)'
                : 'rgba(24, 34, 54, 0.80)';

              ctx.strokeStyle = isOriginCountry ? 'rgba(251, 146, 60, 0.55)'
                : isDestCountry ? 'rgba(56, 189, 248, 0.55)'
                : isInterCountry ? 'rgba(148, 163, 184, 0.38)'
                : 'rgba(148, 163, 184, 0.28)';
              ctx.lineWidth = 0.85;

              const renderPolygon = (poly) => {
                ctx.beginPath();
                poly.forEach((ring) => {
                  if (!ring || ring.length < 3) return;
                  const p0 = projectTrueNorthAtlas(ring[0][0], ring[0][1]);
                  ctx.moveTo(p0.x, p0.y);
                  for (let i = 1; i < ring.length; i++) {
                    const pi = projectTrueNorthAtlas(ring[i][0], ring[i][1]);
                    ctx.lineTo(pi.x, pi.y);
                  }
                  ctx.closePath();
                });
                ctx.fill();
                ctx.stroke();
              };

              if (country.type === 'Polygon') {
                renderPolygon(country.coordinates);
              } else if (country.type === 'MultiPolygon') {
                country.coordinates.forEach(poly => renderPolygon(poly));
              }
            });
            ctx.restore();
          }

          // 3. Great-Circle Flight Corridor & Waypoint Ticks
          ctx.save();
          const railOffset = isMobile ? 3.0 : 4.0;
          const dx = targetPt.x - originPt.x;
          const dy = targetPt.y - originPt.y;
          const dist = Math.hypot(dx, dy) || 1;
          const nx = -dy / dist;
          const ny = dx / dist;

          // Bilateral standing wave corridor fading out
          ctx.strokeStyle = `rgba(56, 189, 248, ${corridorAlpha * 0.45})`;
          ctx.lineWidth = 0.85;
          ctx.beginPath();
          ctx.moveTo(originPt.x - nx * railOffset, originPt.y - ny * railOffset);
          ctx.quadraticCurveTo(mainCp.x - nx * railOffset, mainCp.y - ny * railOffset, targetPt.x - nx * railOffset, targetPt.y - ny * railOffset);
          ctx.stroke();

          ctx.strokeStyle = `rgba(251, 146, 60, ${corridorAlpha * 0.45})`;
          ctx.lineWidth = 0.85;
          ctx.beginPath();
          ctx.moveTo(originPt.x + nx * railOffset, originPt.y + ny * railOffset);
          ctx.quadraticCurveTo(mainCp.x + nx * railOffset, mainCp.y + ny * railOffset, targetPt.x + nx * railOffset, targetPt.y + ny * railOffset);
          ctx.stroke();

          // Authentic Great-Circle centerline
          ctx.strokeStyle = `rgba(56, 189, 248, ${corridorAlpha * 0.60})`;
          ctx.lineWidth = 1.3;
          ctx.beginPath();
          ctx.moveTo(originPt.x, originPt.y);
          ctx.quadraticCurveTo(mainCp.x, mainCp.y, targetPt.x, targetPt.y);
          ctx.stroke();

          // Waypoint crossbar ticks
          for (let uCross of [0.20, 0.45, 0.70]) {
            const pt = getBezierPoint(originPt, mainCp, targetPt, uCross);
            const tangent = getBezierTangent(originPt, mainCp, targetPt, uCross);
            const gnx = -Math.sin(tangent);
            const gny = Math.cos(tangent);
            ctx.strokeStyle = `rgba(56, 189, 248, ${corridorAlpha * 0.65})`;
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(pt.x - gnx * 5, pt.y - gny * 5);
            ctx.lineTo(pt.x + gnx * 5, pt.y + gny * 5);
            ctx.stroke();
          }
          ctx.restore();

          // Jakarta Origin & Tokyo Destination Anchors
          ctx.fillStyle = '#fb923c';
          ctx.beginPath();
          ctx.arc(originPt.x, originPt.y, 4.0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#38bdf8';
          ctx.beginPath();
          ctx.arc(targetPt.x, targetPt.y, 4.0, 0, Math.PI * 2);
          ctx.fill();

          // Contrails & Airliner
          drawDualContrails(originPt, mainCp, targetPt, uFlight, altitudeNorm, isMobile);
          const planePos = getBezierPoint(originPt, mainCp, targetPt, uFlight);
          const planeAngle = getBezierTangent(originPt, mainCp, targetPt, uFlight) + Math.PI / 2;
          drawVectorAirliner(planePos.x, planePos.y, planeAngle, altitudeNorm, isMobile, 1.0);
        }

        // --------------------------------------------------------------------
        // PHASE 2: CONTINUOUS OPTICAL CAMERA DIVE & ORIGIN HANDOFF (t = 8.0s – 10.5s)
        // --------------------------------------------------------------------
        else if (t < T_BRIDGE_END) {
          currentBeatText = 'BRIDGE · CONTINUOUS OPTICAL DIVE & RESIDENCE AWAKENING';
          const sBridge = (t - T_BRIDGE_START) / (T_BRIDGE_END - T_BRIDGE_START);
          // Smooth cubic ease-in-out
          const easeBridge = sBridge < 0.5
            ? 4 * sBridge * sBridge * sBridge
            : 1 - Math.pow(-2 * sBridge + 2, 3) / 2;

          // 1. Regional Layer: Continuous Optical Zoom centered into Tokyo (targetPt)
          const regionalAlpha = Math.max(0.0, 1.0 - easeBridge * 1.35);
          if (regionalAlpha > 0.01 && realCountriesData) {
            ctx.save();
            ctx.globalAlpha = regionalAlpha;
            const zReg = 1.0 + easeBridge * 3.5;
            ctx.translate(targetPt.x, targetPt.y);
            ctx.scale(zReg, zReg);
            ctx.translate(-targetPt.x, -targetPt.y);

            // Regional landmasses expanding outward from Tokyo
            realCountriesData.forEach(country => {
              const isDestCountry = (country.name === 'Japan');
              if (!isDestCountry && easeBridge > 0.45) return;

              ctx.fillStyle = isDestCountry ? 'rgba(56, 189, 248, 0.12)' : 'rgba(24, 34, 54, 0.80)';
              ctx.strokeStyle = isDestCountry ? 'rgba(56, 189, 248, 0.55)' : 'rgba(148, 163, 184, 0.28)';
              ctx.lineWidth = 0.85 / zReg;

              const renderPolygon = (poly) => {
                ctx.beginPath();
                poly.forEach((ring) => {
                  if (!ring || ring.length < 3) return;
                  const p0 = projectTrueNorthAtlas(ring[0][0], ring[0][1]);
                  ctx.moveTo(p0.x, p0.y);
                  for (let i = 1; i < ring.length; i++) {
                    const pi = projectTrueNorthAtlas(ring[i][0], ring[i][1]);
                    ctx.lineTo(pi.x, pi.y);
                  }
                  ctx.closePath();
                });
                ctx.fill();
                ctx.stroke();
              };

              if (country.type === 'Polygon') {
                renderPolygon(country.coordinates);
              } else if (country.type === 'MultiPolygon') {
                country.coordinates.forEach(poly => renderPolygon(poly));
              }
            });

            // Flight Corridor fading
            ctx.strokeStyle = `rgba(56, 189, 248, ${0.40 * (1 - easeBridge)})`;
            ctx.lineWidth = 1.0 / zReg;
            ctx.beginPath();
            ctx.moveTo(originPt.x, originPt.y);
            ctx.quadraticCurveTo(mainCp.x, mainCp.y, targetPt.x, targetPt.y);
            ctx.stroke();

            // Airliner touchdown settling
            if (t < 8.6) {
              const planeAlpha = Math.max(0.0, 1.0 - (t - 8.0) / 0.6);
              const planeAngle = getBezierTangent(originPt, mainCp, targetPt, 1.0) + Math.PI / 2;
              drawVectorAirliner(targetPt.x, targetPt.y, planeAngle, 0.0, isMobile, planeAlpha);
            }
            ctx.restore();
          }

          // 2. Commute Layer: Smoothly zooms into metropolitan Tokyo with unified spatial orientation
          const scaleCommute = 0.60 + 0.40 * easeBridge;
          const curAnchorX = targetPt.x + (univPt.x - targetPt.x) * easeBridge;
          const curAnchorY = targetPt.y + (univPt.y - targetPt.y) * easeBridge;
          const commuteAlpha = Math.min(1.0, easeBridge * 1.35);

          if (commuteAlpha > 0.01) {
            ctx.save();
            ctx.translate(curAnchorX, curAnchorY);
            ctx.scale(scaleCommute, scaleCommute);
            ctx.translate(-univPt.x, -univPt.y);

            // 2a. Roadbed & Waterway Network
            if (!cachedRoadsCanvas || cachedRoadsWidth !== width || cachedRoadsHeight !== height) {
              buildCachedRoadsCanvas();
            }
            if (cachedRoadsCanvas) {
              ctx.save();
              ctx.globalAlpha = commuteAlpha;
              ctx.drawImage(cachedRoadsCanvas, 0, 0, width, height);
              drawAreaContextLabels(ctx, isMobile);
              ctx.restore();
            }

            // 2b. Luminous Touchdown Beacon Spark at Tokyo Tech
            const sparkRadius = (6.0 + 8.0 * (1 - easeBridge)) / scaleCommute;
            ctx.fillStyle = `rgba(56, 189, 248, ${0.55 * commuteAlpha})`;
            ctx.beginPath();
            ctx.arc(univPt.x, univPt.y, sparkRadius, 0, Math.PI * 2);
            ctx.fill();

            // 2c. Connective Amber Thread: Traces from Tokyo Tech southwest across Tama River to Kuji
            const threadProgress = clamp((t - 8.2) / 1.8, 0.0, 1.0);
            if (threadProgress > 0.0) {
              const curThreadX = univPt.x + (placePt.x - univPt.x) * threadProgress;
              const curThreadY = univPt.y + (placePt.y - univPt.y) * threadProgress;
              const threadMidX = (univPt.x + placePt.x) * 0.5;
              const threadMidY = (univPt.y + placePt.y) * 0.5 - 20;

              ctx.strokeStyle = `rgba(251, 146, 60, ${0.90 * commuteAlpha})`;
              ctx.lineWidth = 2.0;
              ctx.shadowColor = 'rgba(251, 146, 60, 0.5)';
              ctx.shadowBlur = 6;
              ctx.beginPath();
              ctx.moveTo(univPt.x, univPt.y);
              ctx.quadraticCurveTo(threadMidX, threadMidY, curThreadX, curThreadY);
              ctx.stroke();
              ctx.shadowBlur = 0;

              // Traveling Energy Pulse
              ctx.fillStyle = '#f8fafc';
              ctx.beginPath();
              ctx.arc(curThreadX, curThreadY, 3.2, 0, Math.PI * 2);
              ctx.fill();
            }

            // 2d. Tokyo Tech Token
            const tokenR = isMobile ? 9.5 : 11.5;
            ctx.save();
            ctx.globalAlpha = commuteAlpha;
            ctx.fillStyle = 'rgba(10, 15, 26, 0.92)';
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.arc(univPt.x, univPt.y, tokenR, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            const crestSize = isMobile ? 12 : 14;
            if (tokyoTechLogoImg.complete && tokyoTechLogoImg.naturalWidth > 0) {
              ctx.drawImage(tokyoTechLogoImg, 38, 0, 125, 126, univPt.x - crestSize * 0.5, univPt.y - crestSize * 0.5, crestSize, crestSize);
            } else {
              ctx.fillStyle = '#38bdf8';
              ctx.beginPath();
              ctx.arc(univPt.x, univPt.y, 2.5, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.restore();

            // 2e. Kuji Residence Awakening (Begins as thread approaches at t = 9.4s)
            const resAwakenAlpha = clamp((t - 9.4) / 0.8, 0.0, 1.0);
            if (resAwakenAlpha > 0.05) {
              ctx.save();
              ctx.globalAlpha = resAwakenAlpha;
              const pulse = (Math.sin(t * 5.0) + 1) * 0.5;
              ctx.strokeStyle = `rgba(251, 146, 60, ${0.35 + pulse * 0.45 * resAwakenAlpha})`;
              ctx.lineWidth = 1.2;
              ctx.beginPath();
              ctx.arc(placePt.x, placePt.y, tokenR + 4 + pulse * 3, 0, Math.PI * 2);
              ctx.stroke();

              ctx.fillStyle = 'rgba(10, 15, 26, 0.92)';
              ctx.strokeStyle = '#fb923c';
              ctx.lineWidth = 1.2;
              ctx.beginPath();
              ctx.arc(placePt.x, placePt.y, tokenR, 0, Math.PI * 2);
              ctx.fill();
              ctx.stroke();
              drawHomeIcon(placePt.x, placePt.y - 0.5, isMobile ? 0.55 : 0.65, '#fb923c');
              ctx.restore();
            }

            ctx.restore();
          }
        }

        // --------------------------------------------------------------------
        // PHASE 3: CYCLE 1 — BICYCLE COMMUTE ROUTINE (t = 10.5s – 18.8s)
        // --------------------------------------------------------------------
        else if (t < T_BIKE_END) {
          // 0. Roadbed & Waterway Network
          if (!cachedRoadsCanvas || cachedRoadsWidth !== width || cachedRoadsHeight !== height) {
            buildCachedRoadsCanvas();
          }
          if (cachedRoadsCanvas) {
            ctx.drawImage(cachedRoadsCanvas, 0, 0, width, height);
          }
          drawAreaContextLabels(ctx, isMobile);

          const outScreen = COMMUTE_PATH.map(p => projectTokyo(p.lon, p.lat));
          const retScreen = RETURN_PATH.map(p => projectTokyo(p.lon, p.lat));
          const N_out = outScreen.length;
          const N_ret = retScreen.length;

          if (t < T_BIKE_DWELL) {
            // Outbound Journey (10.5s – 14.5s)
            currentBeatText = 'BIKE · OUTBOUND VIA NAKAHARA-KAIDO';
            const u = (t - T_BIKE_START) / (T_BIKE_DWELL - T_BIKE_START);
            const curExactIdx = u * (N_out - 1);
            const activeIdx = Math.min(N_out - 1, Math.floor(curExactIdx));
            const bike = getPathPointAndHeading(outScreen, curExactIdx);

            // Active illuminated orange roadbed (strictly behind rear wheel)
            ctx.strokeStyle = 'rgba(249, 115, 22, 0.96)';
            ctx.lineWidth = 3.2;
            ctx.shadowColor = 'rgba(249, 115, 22, 0.40)';
            ctx.shadowBlur = 4;
            ctx.beginPath();
            ctx.moveTo(outScreen[0].x, outScreen[0].y);
            for (let i = 1; i <= activeIdx; i++) ctx.lineTo(outScreen[i].x, outScreen[i].y);
            ctx.lineTo(bike.x, bike.y);
            ctx.stroke();
            ctx.shadowBlur = 0;

            const wheelRot = u * 48.0;
            drawBicycleCommuter(ctx, bike.x, bike.y, bike.angle, bike.tilt, wheelRot, false, isMobile, '#fb923c');

          } else if (t < T_BIKE_RETURN) {
            // Campus Dwell (14.5s – 15.5s)
            currentBeatText = 'BIKE · OOKAYAMA CAMPUS DWELL';
            ctx.strokeStyle = 'rgba(249, 115, 22, 0.55)';
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            ctx.moveTo(outScreen[0].x, outScreen[0].y);
            for (let i = 1; i < N_out; i++) ctx.lineTo(outScreen[i].x, outScreen[i].y);
            ctx.stroke();

            const endBike = getPathPointAndHeading(outScreen, N_out - 1);
            drawBicycleCommuter(ctx, univPt.x - 3, univPt.y, endBike.angle, 0, 0, true, isMobile, '#38bdf8');

            // Swallow Crest Ripple
            const ripplePhase = (t - T_BIKE_DWELL) / (T_BIKE_RETURN - T_BIKE_DWELL);
            ctx.strokeStyle = `rgba(56, 189, 248, ${0.6 * (1 - ripplePhase)})`;
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.arc(univPt.x, univPt.y, 14 + ripplePhase * 22, 0, Math.PI * 2);
            ctx.stroke();

          } else {
            // Return Journey (15.5s – 18.8s)
            currentBeatText = 'BIKE · RETURN VIA TODOROKI-DORI';
            const u = (t - T_BIKE_RETURN) / (T_BIKE_END - T_BIKE_RETURN);

            // Outbound trace remains as memory
            ctx.strokeStyle = 'rgba(249, 115, 22, 0.18)';
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.moveTo(outScreen[0].x, outScreen[0].y);
            for (let i = 1; i < N_out; i++) ctx.lineTo(outScreen[i].x, outScreen[i].y);
            ctx.stroke();

            const curExactIdx = u * (N_ret - 1);
            const activeIdx = Math.min(N_ret - 1, Math.floor(curExactIdx));
            const bike = getPathPointAndHeading(retScreen, curExactIdx);

            ctx.strokeStyle = 'rgba(56, 189, 248, 0.95)';
            ctx.lineWidth = 3.2;
            ctx.shadowColor = 'rgba(56, 189, 248, 0.40)';
            ctx.shadowBlur = 4;
            ctx.beginPath();
            ctx.moveTo(retScreen[0].x, retScreen[0].y);
            for (let i = 1; i <= activeIdx; i++) ctx.lineTo(retScreen[i].x, retScreen[i].y);
            ctx.lineTo(bike.x, bike.y);
            ctx.stroke();
            ctx.shadowBlur = 0;

            const wheelRot = u * 48.0;
            drawBicycleCommuter(ctx, bike.x, bike.y, bike.angle, bike.tilt, wheelRot, false, isMobile, '#38bdf8');
          }

          // Tokens
          const tokenR = isMobile ? 9.5 : 11.5;
          ctx.fillStyle = 'rgba(10, 15, 26, 0.92)';
          ctx.strokeStyle = '#fb923c';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.arc(placePt.x, placePt.y, tokenR, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          drawHomeIcon(placePt.x, placePt.y - 0.5, isMobile ? 0.55 : 0.65, '#fb923c');

          ctx.strokeStyle = '#38bdf8';
          ctx.beginPath();
          ctx.arc(univPt.x, univPt.y, tokenR, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          const crestSize = isMobile ? 12 : 14;
          if (tokyoTechLogoImg.complete && tokyoTechLogoImg.naturalWidth > 0) {
            ctx.drawImage(tokyoTechLogoImg, 38, 0, 125, 126, univPt.x - crestSize * 0.5, univPt.y - crestSize * 0.5, crestSize, crestSize);
          }
        }

        // --------------------------------------------------------------------
        // PHASE 4: CYCLE 2 — COMMUTER RAIL ROUTINE (t = 18.8s – 28.5s)
        // --------------------------------------------------------------------
        else {
          // 0. Roadbed & Waterway Network
          if (!cachedRoadsCanvas || cachedRoadsWidth !== width || cachedRoadsHeight !== height) {
            buildCachedRoadsCanvas();
          }
          if (cachedRoadsCanvas) {
            ctx.drawImage(cachedRoadsCanvas, 0, 0, width, height);
          }
          drawAreaContextLabels(ctx, isMobile);

          const walkOrigScreen = transitWalkOrigin.map(p => projectTokyo(p.lon, p.lat));
          const nambuScreen = transitRailNambu.map(p => projectTokyo(p.lon, p.lat));
          const oimachiScreen = transitRailOimachi.map(p => projectTokyo(p.lon, p.lat));
          const walkDestScreen = transitWalkDest.map(p => projectTokyo(p.lon, p.lat));

          const N_wOrig = walkOrigScreen.length;
          const N_nambu = nambuScreen.length;
          const N_oimachi = oimachiScreen.length;
          const N_wDest = walkDestScreen.length;

          let activeStationId = null;

          if (t < T_TRAIN_NAMBU) {
            // Leg 1: Walk to Kuji Station (18.8s – 20.2s)
            currentBeatText = 'RAIL · WALK TO KUJI STATION';
            const w = (t - T_TRAIN_START) / (T_TRAIN_NAMBU - T_TRAIN_START);
            const curExactIdx = w * (N_wOrig - 1);
            const activeIdx = Math.min(N_wOrig - 1, Math.floor(curExactIdx));
            const walker = getPathPointAndHeading(walkOrigScreen, curExactIdx);

            ctx.strokeStyle = 'rgba(241, 245, 249, 0.90)';
            ctx.lineWidth = 2.2;
            ctx.setLineDash([3, 3]);
            ctx.beginPath();
            ctx.moveTo(walkOrigScreen[0].x, walkOrigScreen[0].y);
            for (let i = 1; i <= activeIdx; i++) ctx.lineTo(walkOrigScreen[i].x, walkOrigScreen[i].y);
            ctx.lineTo(walker.x, walker.y);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = '#f8fafc';
            ctx.beginPath();
            ctx.arc(walker.x, walker.y, 3.0, 0, Math.PI * 2);
            ctx.fill();

            activeStationId = (w > 0.70) ? 'kuji' : null;

          } else if (t < T_TRAIN_TRANSFER) {
            // Leg 2: JR Nambu Line Train (20.2s – 22.8s)
            currentBeatText = 'RAIL · JR NAMBU LINE (VIOLET)';
            // Prior walk trace
            ctx.strokeStyle = 'rgba(241, 245, 249, 0.35)';
            ctx.lineWidth = 1.6;
            ctx.setLineDash([2, 3]);
            ctx.beginPath();
            ctx.moveTo(walkOrigScreen[0].x, walkOrigScreen[0].y);
            for (let i = 1; i < N_wOrig; i++) ctx.lineTo(walkOrigScreen[i].x, walkOrigScreen[i].y);
            ctx.stroke();
            ctx.setLineDash([]);

            const w = (t - T_TRAIN_NAMBU) / (T_TRAIN_TRANSFER - T_TRAIN_NAMBU);
            const nambuMotion = getNambuStationProgress(w);
            const curExactIdx = nambuMotion.s * (N_nambu - 1);
            const activeIdx = Math.min(N_nambu - 1, Math.floor(curExactIdx));
            const train = getPathPointAndHeading(nambuScreen, curExactIdx);

            ctx.strokeStyle = 'rgba(129, 140, 248, 0.95)';
            ctx.lineWidth = 3.2;
            ctx.shadowColor = 'rgba(129, 140, 248, 0.45)';
            ctx.shadowBlur = 4;
            ctx.beginPath();
            ctx.moveTo(nambuScreen[0].x, nambuScreen[0].y);
            for (let i = 1; i <= activeIdx; i++) ctx.lineTo(nambuScreen[i].x, nambuScreen[i].y);
            ctx.lineTo(train.x, train.y);
            ctx.stroke();
            ctx.shadowBlur = 0;

            drawMetroTrain(ctx, train.x, train.y, train.angle, '#818cf8', nambuMotion.isMoving, isMobile);
            activeStationId = nambuMotion.stationId;

          } else if (t < T_TRAIN_OIMACHI) {
            // Leg 3: Concourse Transfer at Mizonokuchi (22.8s – 24.0s)
            currentBeatText = 'RAIL · MIZONOKUCHI CONCOURSE TRANSFER';
            // Completed JR Nambu line
            ctx.strokeStyle = 'rgba(129, 140, 248, 0.45)';
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.moveTo(nambuScreen[0].x, nambuScreen[0].y);
            for (let i = 1; i < N_nambu; i++) ctx.lineTo(nambuScreen[i].x, nambuScreen[i].y);
            ctx.stroke();

            const w = (t - T_TRAIN_TRANSFER) / (T_TRAIN_OIMACHI - T_TRAIN_TRANSFER);
            const ptMizoJR = nambuScreen[N_nambu - 1];
            const ptMizoTokyu = oimachiScreen[0];
            const transX = ptMizoJR.x + (ptMizoTokyu.x - ptMizoJR.x) * w;
            const transY = ptMizoJR.y + (ptMizoTokyu.y - ptMizoJR.y) * w;

            ctx.strokeStyle = 'rgba(165, 180, 252, 0.85)';
            ctx.lineWidth = 2.0;
            ctx.setLineDash([2, 2]);
            ctx.beginPath();
            ctx.moveTo(ptMizoJR.x, ptMizoJR.y);
            ctx.lineTo(transX, transY);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = '#a5b4fc';
            ctx.beginPath();
            ctx.arc(transX, transY, 3.2, 0, Math.PI * 2);
            ctx.fill();

            activeStationId = 'mizonokuchi';

          } else if (t < T_TRAIN_ARRIVAL) {
            // Leg 4: Tokyu Oimachi Line Train across Tama River (24.0s – 27.2s)
            currentBeatText = 'RAIL · TOKYU OIMACHI VIADUCT ACROSS TAMA RIVER (CYAN)';
            // JR Nambu line memory trace
            ctx.strokeStyle = 'rgba(129, 140, 248, 0.35)';
            ctx.lineWidth = 2.0;
            ctx.beginPath();
            ctx.moveTo(nambuScreen[0].x, nambuScreen[0].y);
            for (let i = 1; i < N_nambu; i++) ctx.lineTo(nambuScreen[i].x, nambuScreen[i].y);
            ctx.stroke();

            const w = (t - T_TRAIN_OIMACHI) / (T_TRAIN_ARRIVAL - T_TRAIN_OIMACHI);
            const oimachiMotion = getOimachiStationProgress(w);
            const curExactIdx = oimachiMotion.s * (N_oimachi - 1);
            const activeIdx = Math.min(N_oimachi - 1, Math.floor(curExactIdx));
            const train = getPathPointAndHeading(oimachiScreen, curExactIdx);

            ctx.strokeStyle = 'rgba(6, 182, 212, 0.95)';
            ctx.lineWidth = 3.2;
            ctx.shadowColor = 'rgba(6, 182, 212, 0.45)';
            ctx.shadowBlur = 4;
            ctx.beginPath();
            ctx.moveTo(oimachiScreen[0].x, oimachiScreen[0].y);
            for (let i = 1; i <= activeIdx; i++) ctx.lineTo(oimachiScreen[i].x, oimachiScreen[i].y);
            ctx.lineTo(train.x, train.y);
            ctx.stroke();
            ctx.shadowBlur = 0;

            drawMetroTrain(ctx, train.x, train.y, train.angle, '#06b6d4', oimachiMotion.isMoving, isMobile);
            activeStationId = oimachiMotion.stationId;

          } else {
            // Leg 5: Walk from Ookayama Station to Main Gate (27.2s – 28.5s)
            currentBeatText = 'RAIL · ARRIVAL AT TOKYO TECH MAIN GATE';
            ctx.strokeStyle = 'rgba(6, 182, 212, 0.45)';
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.moveTo(oimachiScreen[0].x, oimachiScreen[0].y);
            for (let i = 1; i < N_oimachi; i++) ctx.lineTo(oimachiScreen[i].x, oimachiScreen[i].y);
            ctx.stroke();

            const w = (t - T_TRAIN_ARRIVAL) / (TOTAL_DURATION - T_TRAIN_ARRIVAL);
            const curExactIdx = w * (N_wDest - 1);
            const activeIdx = Math.min(N_wDest - 1, Math.floor(curExactIdx));
            const walker = getPathPointAndHeading(walkDestScreen, curExactIdx);

            ctx.strokeStyle = 'rgba(241, 245, 249, 0.90)';
            ctx.lineWidth = 2.2;
            ctx.setLineDash([3, 3]);
            ctx.beginPath();
            ctx.moveTo(walkDestScreen[0].x, walkDestScreen[0].y);
            for (let i = 1; i <= activeIdx; i++) ctx.lineTo(walkDestScreen[i].x, walkDestScreen[i].y);
            ctx.lineTo(walker.x, walker.y);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.arc(walker.x, walker.y, 3.2, 0, Math.PI * 2);
            ctx.fill();

            const ptTrainEnd = oimachiScreen[N_oimachi - 1];
            const headingEnd = getPathPointAndHeading(oimachiScreen, N_oimachi - 1);
            drawMetroTrain(ctx, ptTrainEnd.x, ptTrainEnd.y, headingEnd.angle, '#06b6d4', false, isMobile);
            activeStationId = 'ookayama';
          }

          drawTransitStations(ctx, activeStationId, t, isMobile);

          // Tokens
          const tokenR = isMobile ? 9.5 : 11.5;
          ctx.fillStyle = 'rgba(10, 15, 26, 0.92)';
          ctx.strokeStyle = '#fb923c';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.arc(placePt.x, placePt.y, tokenR, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          drawHomeIcon(placePt.x, placePt.y - 0.5, isMobile ? 0.55 : 0.65, '#fb923c');

          ctx.strokeStyle = '#38bdf8';
          ctx.beginPath();
          ctx.arc(univPt.x, univPt.y, tokenR, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          const crestSize = isMobile ? 12 : 14;
          if (tokyoTechLogoImg.complete && tokyoTechLogoImg.naturalWidth > 0) {
            ctx.drawImage(tokyoTechLogoImg, 38, 0, 125, 126, univPt.x - crestSize * 0.5, univPt.y - crestSize * 0.5, crestSize, crestSize);
          }
        }

        // Update Review UI HUD
        beatLabel.textContent = currentBeatText;
        timeSlider.value = t.toFixed(2);
        timeDisplay.textContent = `${t.toFixed(2)}s / ${TOTAL_DURATION.toFixed(2)}s`;

        beatBtns.forEach(btn => {
          const bt = parseFloat(btn.dataset.t);
          if (Math.abs(t - bt) < 0.6) btn.classList.add('is-active');
          else btn.classList.remove('is-active');
        });
      }

      // Animation Tick Loop
      function tick(now) {
        if (!lastTimestamp) lastTimestamp = now;
        const delta = (now - lastTimestamp) / 1000;
        lastTimestamp = now;

        if (isPlaying) {
          currentTime += delta * playSpeed;
          if (currentMode === 'bike' && currentTime > T_BIKE_END) {
            currentTime = T_BIKE_START;
          } else if (currentMode === 'train' && currentTime > TOTAL_DURATION) {
            currentTime = T_TRAIN_START;
          } else if (currentTime > TOTAL_DURATION) {
            currentTime = 0.0;
          }
        }

        render(currentTime);
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);

      // Expose Automation API for CDP verification
      window.scene04DIntegration = {
        seek: function (t) {
          currentTime = clamp(t, 0, TOTAL_DURATION);
          isPlaying = false;
          updatePlayPauseUI();
          render(currentTime);
        },
        play: function () {
          isPlaying = true;
          lastTimestamp = null;
          updatePlayPauseUI();
        },
        pause: function () {
          isPlaying = false;
          updatePlayPauseUI();
        },
        getCurrentTime: function () {
          return currentTime;
        },
        setSpeed: function (s) {
          playSpeed = s;
        },
        setMode: function (m) {
          currentMode = m;
        }
      };
      window.scene04DController = window.scene04DIntegration;

    })();
  </script>
</body>
</html>
