<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chapter 03 Scene 01 — Opening Transition Explorations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Newsreader:opsz,wght@6..72,300;400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090e;
      --surface: #0b0f16;
      --surface-2: #101620;
      --line: rgba(148,163,184,.26);
      --line-soft: rgba(148,163,184,.12);
      --steel: #64748b;
      --steel-2: #94a3b8;
      --text: #f4f1e8;
      --muted: #8b93a0;
      --amber: #f59e0b;
      --amber-deep: #d97706;
      --orange: #ea580c;
      --cyan: #64b5f6;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body {
      font-family: "Plus Jakarta Sans", sans-serif;
      padding: 28px;
      background:
        radial-gradient(circle at 52% 28%, rgba(54,67,88,.13), transparent 34%),
        radial-gradient(circle at 14% 8%, rgba(245,158,11,.035), transparent 24%),
        #07090e;
    }

    .shell { max-width: 1260px; margin: 0 auto; }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: end;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      margin-bottom: 18px;
    }

    .kicker {
      font: 500 10px/1 "JetBrains Mono", monospace;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font: 300 30px/1.1 "Newsreader", serif;
      letter-spacing: -.015em;
    }

    .sub {
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
      max-width: 720px;
      line-height: 1.55;
    }

    .status {
      font: 500 9px/1 "JetBrains Mono", monospace;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #b8bec8;
      border: 1px solid rgba(255,255,255,.10);
      padding: 8px 10px;
      white-space: nowrap;
    }

    .reviewbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .tabs, .frames {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    button {
      appearance: none;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.025);
      color: var(--muted);
      font: 500 10px/1 "JetBrains Mono", monospace;
      letter-spacing: .05em;
      padding: 9px 11px;
      cursor: pointer;
    }

    button:hover { color: var(--text); border-color: rgba(255,255,255,.18); }
    button.active {
      color: var(--text);
      border-color: rgba(245,158,11,.48);
      background: rgba(245,158,11,.08);
    }

    .stage {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.085);
      min-height: 650px;
      background:
        radial-gradient(circle at 70% 40%, rgba(39,51,71,.20), transparent 38%),
        linear-gradient(180deg, #0a0e15, #06080d 75%);
      box-shadow: 0 26px 70px rgba(0,0,0,.38);
    }

    svg { display: block; width: 100%; height: auto; min-height: 650px; }

    .meta {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 18px;
      margin-top: 14px;
    }

    .panel {
      border-top: 1px solid rgba(255,255,255,.08);
      padding-top: 12px;
    }

    .panel-title {
      font: 600 9px/1 "JetBrains Mono", monospace;
      text-transform: uppercase;
      letter-spacing: .14em;
      color: var(--amber);
      margin-bottom: 7px;
    }

    .panel p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .frame-group, .study-layer { display: none; }
    .frame-group.visible, .study-layer.visible { display: block; }

    .tiny-label {
      font-family: "JetBrains Mono", monospace;
      font-size: 9px;
      letter-spacing: .10em;
      text-transform: uppercase;
    }

    @media (max-width: 780px) {
      body { padding: 16px; }
      .topbar { align-items: start; flex-direction: column; }
      h1 { font-size: 25px; }
      .stage { min-height: 520px; }
      svg { min-height: 520px; }
      .meta { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div>
      <div class="kicker">Chapter 03 · Scene 01 · Opening Exploration</div>
      <h1>From Thesis Apparatus to Industrial Service</h1>
      <div class="sub">Static/keyframe comparison only. No production integration, service action, cost, SAP, profitability, or downstream scene logic in this workspace.</div>
    </div>
    <div class="status">Review sandbox · not frozen</div>
  </header>

  <div class="reviewbar">
    <div class="tabs">
      <button class="study-btn active" data-study="A">A · Technical Assembly</button>
      <button class="study-btn" data-study="C">C · Material Transformation</button>
    </div>
    <div class="frames" id="frameButtons"></div>
  </div>

  <section class="stage">
    <svg id="board" viewBox="0 0 1200 650" role="img" aria-label="Chapter 03 opening transition exploration">
      <defs>

          <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>

          <stop offset="1" stop-color="#101720"/>
        </linearGradient>
        <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="5"/>
        </filter>

        <g id="stars" fill="#d8dee8">
          <circle cx="74" cy="92" r="1" opacity=".34"/>
          <circle cx="188" cy="64" r=".8" opacity=".18"/>
          <circle cx="344" cy="111" r="1.2" opacity=".26"/>
          <circle cx="522" cy="72" r=".8" opacity=".22"/>
          <circle cx="672" cy="118" r="1" opacity=".20"/>
          <circle cx="836" cy="74" r=".9" opacity=".28"/>
          <circle cx="1012" cy="126" r="1.1" opacity=".22"/>
          <circle cx="1132" cy="86" r=".8" opacity=".30"/>
          <circle cx="96" cy="542" r=".9" opacity=".16"/>
          <circle cx="286" cy="584" r="1.1" opacity=".22"/>
          <circle cx="548" cy="546" r=".8" opacity=".22"/>
          <circle cx="758" cy="598" r="1" opacity=".18"/>
          <circle cx="1006" cy="558" r=".9" opacity=".24"/>
        </g>

        <!-- Simplified thesis-apparatus silhouette; visual continuity reference only. -->
        <g id="thesisRig" fill="none" stroke="#718096" stroke-width="1.5">
          <path d="M150 424 H468" opacity=".40"/>
          <rect x="176" y="278" width="92" height="142" rx="45" fill="#101720" stroke="#8792a2"/>
          <path d="M222 278 V236 H356 V262" />

          <path d="M164 374 H176" />

        <g id="identityCue">
          <text x="760" y="176" fill="#f3efe5" font-family="Newsreader, serif" font-size="23" font-weight="300">Traktor Nusantara</text>
          <text x="762" y="198" fill="#8b93a0" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="1.8">2019 · PROFESSIONAL ENTRY</text>
        </g>

        <g id="originCue">
          <text x="150" y="176" fill="#f3efe5" font-family="Newsreader, serif" font-size="18" font-weight="300">Universitas Indonesia</text>
          <text x="151" y="196" fill="#7d8795" font-family="JetBrains Mono, monospace" font-size="8.5" letter-spacing="1.6">THESIS APPARATUS · FINAL HOLD</text>
        </g>
      </defs>

      <use href="#stars"/>

      <!-- STUDY A -->
      <g id="study-A" class="study-layer visible">
        <g class="frame-group visible" data-frame="0">
          <use href="#originCue"/>
          <use href="#thesisRig"/>
          <circle cx="356" cy="236" r="20" fill="url(#signalGlow)" opacity=".55"/>
          <circle cx="356" cy="236" r="4.4" fill="#f59e0b"/>
        </g>

        <g class="frame-group" data-frame="1">
          <use href="#originCue" opacity=".72"/>
          <use href="#thesisRig" opacity=".54"/>

        <g class="frame-group" data-frame="2">
          <use href="#thesisRig" opacity=".16"/>
          <use href="#draftGuides"/>
          <path d="M520 282 C596 302 650 330 714 356" fill="none" stroke="#f59e0b" stroke-width="1.2" opacity=".42"/>
          <circle cx="714" cy="356" r="22" fill="url(#signalGlow)" opacity=".5"/>
          <circle cx="714" cy="356" r="4.4" fill="#f59e0b"/>
          <path d="M760 386 L802 316 H912" fill="none" stroke="#8a96a7" stroke-width="1.5" opacity=".42"/>
          <circle cx="806" cy="402" r="31" fill="none" stroke="#6e7c8c" stroke-width="1.4" opacity=".42"/>
        </g>

        <g class="frame-group" data-frame="3">
          <use href="#thesisRig" opacity=".07"/>
          <use href="#draftGuides" opacity=".6"/>
          <use href="#industrialUnit" opacity=".76"/>
          <use href="#technician" opacity=".48"/>
          <use href="#componentZone" opacity=".38"/>
          <circle cx="1044" cy="344" r="23" fill="url(#signalGlow)" opacity=".38"/>
          <circle cx="1044" cy="344" r="4.4" fill="#f59e0b"/>
        </g>

        <g class="frame-group" data-frame="4">
          <use href="#identityCue"/>
          <use href="#industrialUnit"/>
          <use href="#technician"/>
          <use href="#componentZone"/>
          <circle cx="1044" cy="344" r="20" fill="url(#signalGlow)" opacity=".38"/>
          <circle cx="1044" cy="344" r="4.4" fill="#f59e0b"/>
        </g>
      </g>

      <!-- STUDY C -->
      <g id="study-C" class="study-layer">
        <g class="frame-group visible" data-frame="0">
          <use href="#originCue"/>
          <use href="#thesisRig"/>
          <circle cx="356" cy="236" r="20" fill="url(#signalGlow)" opacity=".55"/>
          <circle cx="356" cy="236" r="4.4" fill="#f59e0b"/>
        </g>

        <g class="frame-group" data-frame="1">
          <use href="#originCue" opacity=".8"/>
          <use href="#thesisRig" opacity=".62"/>
          <use href="#transferLines"/>
          <circle cx="356" cy="236" r="24" fill="url(#signalGlow)" opacity=".55"/>

          <path d="M222 278 C340 276 522 276 814 266" fill="none" stroke="#f59e0b" stroke-width="1.35" opacity=".62"/>

        </g>

        <g class="frame-group" data-frame="4">
          <use href="#thesisRig" opacity=".035"/>
          <use href="#industrialUnit" opacity=".94"/>
          <use href="#technician" opacity=".85"/>
          <use href="#componentZone" opacity=".82"/>
          <path d="M708 424 H842" fill="none" stroke="#f59e0b" stroke-width="1.2" opacity=".36"/>
          <path d="M814 316 V266 H864" fill="none" stroke="#f59e0b" stroke-width="1.2" opacity=".30"/>

          <circle cx="1044" cy="344" r="23" fill="url(#signalGlow)" opacity=".38"/>
          <circle cx="1044" cy="344" r="4.4" fill="#f59e0b"/>
          <use href="#identityCue" opacity=".52"/>
        </g>

        <g class="frame-group" data-frame="5">
          <use href="#identityCue"/>
          <use href="#industrialUnit"/>
          <use href="#technician"/>
          <use href="#componentZone"/>
          <circle cx="1044" cy="344" r="20" fill="url(#signalGlow)" opacity=".38"/>

      </g>

      <text x="46" y="606" fill="#626d7b" class="tiny-label">Static keyframe review · no motion timing implied</text>
      <text x="1154" y="606" fill="#626d7b" text-anchor="end" class="tiny-label">Beat 01–02 boundary only</text>
    </svg>
  </section>

  <div class="meta">
    <div class="panel">
      <div class="panel-title">Current frame</div>
      <p id="frameDescription"></p>
    </div>
    <div class="panel">
      <div class="panel-title">Review question</div>
      <p id="reviewQuestion"></p>
    </div>
  </div>
</div>

<script>
  const studies = {
    A: {
      frames: [
        ["A0 · Thesis hold", "Exact narrative inheritance: completed engineering thesis apparatus remains the active subject.", "Does this still read as the end of Chapter 02 rather than a new scene?"],
        ["A1 · Release", "The continuity signal separates while the apparatus becomes secondary.", "Is the handoff calm and traceable rather than a hard scene cut?"],
        ["A2 · Draft path", "Fine construction guides appear ahead of the signal; the professional environment is being prepared.", "Does this feel engineered rather than like a generic blueprint effect?"],
        ["A3 · Industrial construction", "The service-unit geometry assembles around the arriving signal.", "Does the destination already read as industrial service work without needing explanatory text?"],
        ["A4 · Arrival hold", "The new industrial plate is stable and ready for Beat 03; no service action has begun.", "Is this a strong enough professional-world composition to support the rest of Scene 01?"]
      ]
    },
    C: {
      frames: [
        ["C0 · Thesis hold", "Exact narrative inheritance: completed thesis apparatus, stable final hold.", "Does the transition start from a recognizably finished academic-engineering state?"],
        ["C1 · Structural extraction", "Only a few transferable relationships are highlighted; the full apparatus does not morph.", "Are we extracting visual relationships rather than performing a gimmicky object transformation?"],
        ["C2 · Re-routing", "The selected relationships travel with the warm continuity signal through negative space.", "Can the viewer follow where the new geometry came from?"],
        ["C3 · Recomposition", "Inherited relationships establish chassis, vertical service geometry, and a mechanical circular motif before new detail is added.", "Does the new industrial structure feel causally connected to the old engineering grammar?"],
        ["C4 · Identity shift", "The professional service composition takes over while faint inherited geometry remains as memory.", "Is the old scene receding at the right moment without disappearing too early?"],
        ["C5 · Arrival hold", "The industrial service plate is stable; continuity signal rests at the future service-action point.", "Does this feel personal, mature, and ready for Beat 03 without already explaining cost control?"]
      ]
    }
  };

  let currentStudy = "A";
  let currentFrame = 0;

  const frameButtons = document.getElementById("frameButtons");
  const frameDescription = document.getElementById("frameDescription");
  const reviewQuestion = document.getElementById("reviewQuestion");

  function render() {
    document.querySelectorAll(".study-layer").forEach(el => el.classList.remove("visible"));
    const activeStudy = document.getElementById("study-" + currentStudy);
    activeStudy.classList.add("visible");

    activeStudy.querySelectorAll(".frame-group").forEach(el => {
      el.classList.toggle("visible", Number(el.dataset.frame) === currentFrame);
    });

    document.querySelectorAll(".study-btn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.study === currentStudy);
    });

    frameButtons.innerHTML = "";
    studies[currentStudy].frames.forEach((frame, index) => {
      const button = document.createElement("button");
      button.textContent = frame[0];
      button.className = index === currentFrame ? "active" : "";
      button.addEventListener("click", () => {
        currentFrame = index;
        render();
      });
      frameButtons.appendChild(button);
    });

    const data = studies[currentStudy].frames[currentFrame];
    frameDescription.textContent = data[1];
    reviewQuestion.textContent = data[2];
  }

  document.querySelectorAll(".study-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      currentStudy = btn.dataset.study;
      currentFrame = 0;
      render();
    });
  });

  render();
</script>
</body>
</html>
