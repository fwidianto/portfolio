    /* Hero night sky with blinking stars */
    body:has(.hero--red-dwarf) nav,
    nav {
      border-bottom: none !important;
    }
    .hero-red-dwarf__sky {
      inset: 0;
      pointer-events: none;
      position: absolute;
      overflow: hidden;
      z-index: 0;
      background:
        radial-gradient(circle at 18% 25%, rgba(20, 26, 42, 0.45) 0%, transparent 58%),
        radial-gradient(circle at 82% 55%, rgba(60, 20, 12, 0.28) 0%, transparent 62%);
    }
    .hero-red-dwarf__night-sky {
      display: block;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .hero-red-dwarf__night-sky .star {
      transform-origin: center;
      transform-box: fill-box;
    }
    .hero-red-dwarf__night-sky .star--twinkle-1 {
      animation: star-blink-1 2.8s ease-in-out infinite;
    }
    .hero-red-dwarf__night-sky .star--twinkle-2 {
      animation: star-blink-2 4.1s ease-in-out infinite 0.75s;
    }
    .hero-red-dwarf__night-sky .star--twinkle-3 {
      animation: star-blink-3 3.4s ease-in-out infinite 1.4s;
    }
    .hero-red-dwarf__night-sky .star--twinkle-4 {
      animation: star-blink-4 5.2s ease-in-out infinite 2.2s;
    }
    .hero-red-dwarf__night-sky .star--beacon {
      animation: star-beacon-pulse 4.6s ease-in-out infinite;
    }
    @keyframes star-blink-1 {
      0%, 100% { opacity: 0.20; transform: scale(0.75); }
      35% { opacity: 0.95; transform: scale(1.18); }
      52% { opacity: 0.32; transform: scale(0.85); }
      72% { opacity: 0.88; transform: scale(1.06); }
    }
    @keyframes star-blink-2 {
      0%, 100% { opacity: 0.78; transform: scale(1.02); }
      28% { opacity: 0.16; transform: scale(0.72); }
      62% { opacity: 1.0; transform: scale(1.22); }
      82% { opacity: 0.38; transform: scale(0.85); }
    }
    @keyframes star-blink-3 {
      0%, 100% { opacity: 0.22; transform: scale(0.8); }
      45% { opacity: 0.92; transform: scale(1.12); }
      60% { opacity: 0.28; transform: scale(0.82); }
      85% { opacity: 0.82; transform: scale(1.04); }
    }
    @keyframes star-blink-4 {
      0%, 100% { opacity: 0.35; transform: scale(0.85); }
      22% { opacity: 0.96; transform: scale(1.16); }
      42% { opacity: 0.22; transform: scale(0.78); }
      68% { opacity: 0.88; transform: scale(1.08); }
      84% { opacity: 0.18; transform: scale(0.72); }
    }
    @keyframes star-beacon-pulse {
      0%, 100% { opacity: 0.42; filter: drop-shadow(0 0 2px rgba(255, 240, 220, 0.45)); transform: scale(0.88); }
      50% { opacity: 1.0; filter: drop-shadow(0 0 5px rgba(255, 240, 220, 0.95)) drop-shadow(0 0 11px rgba(255, 185, 130, 0.5)); transform: scale(1.18); }
    }

    /* 14s Formation Layer & Replay Controls */
    .hero-red-dwarf__formation-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      transition: opacity 0.6s ease-out;
    }
    .hero-red-dwarf__replay-btn {
      position: absolute;
      bottom: 12px;
      right: clamp(10px, 3vw, 40px);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(14, 18, 28, 0.76);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(244, 239, 232, 0.18);
      border-radius: 999px;
      color: #f4efe8;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px);
      transition: opacity 0.5s ease, background 0.2s ease, border-color 0.2s ease, transform 0.3s ease;
      z-index: 10;
    }
    .hero-red-dwarf__replay-btn.is-visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    .hero-red-dwarf__replay-btn:hover {
      background: rgba(28, 34, 48, 0.92);
      border-color: rgba(255, 140, 60, 0.5);
      color: #ffffff;
      transform: translateY(-1px);
    }
    .hero-red-dwarf__replay-btn:focus-visible {
      outline: 2px solid #ff8c3c;
      outline-offset: 3px;
    }
    .hero-red-dwarf__replay-icon {
      width: 13px;
      height: 13px;
      color: #ff9d54;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .hero-red-dwarf__replay-btn:hover .hero-red-dwarf__replay-icon {
      transform: rotate(-120deg);
    }
    .hero-red-dwarf__replay-kbd {
      display: inline-block;
      padding: 1px 5px;
      font-size: 10px;
      font-family: monospace;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 4px;
      color: rgba(244, 239, 232, 0.75);
    }
    @media (max-width: 900px) {
      .hero-red-dwarf__replay-btn {
        position: relative;
        bottom: auto;
        right: auto;
        margin: 18px auto 0;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .hero-red-dwarf__night-sky .star {
        animation: none !important;
        opacity: 0.55 !important;
        transform: none !important;
      }
      .hero-red-dwarf__replay-btn,
      .hero-red-dwarf__formation-canvas {
        display: none !important;
      }
    }
  </style>
